<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Prototype - C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05070f; --bg2:#080c18;
    --panel:rgba(14,21,36,.92); --panel2:#0e1728; --panel3:#0a111f;
    --line:rgba(150,180,225,.13); --line2:rgba(150,180,225,.22);
    --blue:#4cc4f7; --blue-dim:#2a7fa8; --violet:#a78bfa; --amber:#fbbf24; --green:#34d399;
    --text:#eef4ff; --muted:#8ba0c1; --muted2:#61749a;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --shadow:0 18px 44px -22px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:
      radial-gradient(1100px 560px at 12% -8%, rgba(76,196,247,.10), transparent 62%),
      radial-gradient(900px 520px at 92% 4%, rgba(167,139,250,.09), transparent 60%),
      linear-gradient(180deg,var(--bg2),var(--bg) 60%);
    color:var(--text);font-family:var(--sans);
    display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;
    letter-spacing:-.005em;
  }

  /* ---------- top bar ---------- */
  #bar{
    flex:none;display:flex;align-items:center;gap:12px;padding:13px 18px;
    background:linear-gradient(180deg,rgba(13,21,36,.96),rgba(8,13,24,.92));
    border-bottom:1px solid var(--line);z-index:30;
    box-shadow:0 1px 0 rgba(255,255,255,.03), 0 12px 30px -24px #000;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  }
  #q{
    flex:1 1 auto;min-width:0;color:var(--text);font-family:inherit;
    background:linear-gradient(180deg,#060c17,#0a1120);
    border:1px solid var(--line);border-radius:13px;
    padding:13px 17px;font-size:14.5px;letter-spacing:.01em;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.04), inset 0 2px 10px rgba(0,0,0,.45);
    transition:border-color .22s ease, box-shadow .22s ease, background .22s ease;
  }
  #q::placeholder{color:#5e7297;letter-spacing:.01em}
  #q:hover{border-color:var(--line2)}
  #q:focus{
    outline:none;border-color:rgba(76,196,247,.62);background:linear-gradient(180deg,#071021,#0b1426);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 0 0 4px rgba(76,196,247,.13);
  }
  #go{
    flex:none;border:0;cursor:pointer;font-family:inherit;
    background:linear-gradient(180deg,#63cffb,#2aa6e0);color:#02121e;
    padding:13px 24px;border-radius:13px;font-size:14px;font-weight:700;letter-spacing:.01em;
    box-shadow:0 10px 22px -12px rgba(76,196,247,.85), inset 0 1px 0 rgba(255,255,255,.45);
    transition:transform .16s ease, box-shadow .2s ease, filter .2s ease;
  }
  #go:hover{filter:brightness(1.07);box-shadow:0 14px 26px -12px rgba(76,196,247,.95), inset 0 1px 0 rgba(255,255,255,.5)}
  #go:active{transform:translateY(1px)}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}

  /* ---------- layout ---------- */
  #split{flex:1 1 auto;min-height:0;display:grid;overflow:hidden;
         grid-template-columns:minmax(0,1fr) clamp(270px, 26vw, 440px)}
  #stage{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;cursor:grab;
         transition:background-color .45s ease}
  #stage.dim canvas{opacity:.22;transition:opacity .3s ease}
  #stage:active{cursor:grabbing}
  #stage canvas{display:block}
  #status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;
          font-size:13.5px;color:#c3d4ec;background:rgba(9,15,28,.94);border:1px solid var(--line2);
          padding:18px 24px;border-radius:15px;max-width:80%;line-height:1.68;display:none;
          box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
  #hint{position:absolute;left:16px;bottom:13px;font-size:11.5px;color:#5b6d8d;pointer-events:none;
        letter-spacing:.02em;background:rgba(6,10,20,.4);padding:5px 10px;border-radius:8px}

  /* photographic finish over the 3D view */
  #fx{position:absolute;inset:0;pointer-events:none;z-index:5;
      background:radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 42%, rgba(3,6,12,.58) 100%)}
  #grain{position:absolute;inset:0;pointer-events:none;z-index:6;opacity:.045;
         mix-blend-mode:overlay;background-repeat:repeat;background-size:140px 140px}

  /* author mark - rebuilt automatically if it is ever removed */
  .rc-mark{display:flex;align-items:center;gap:13px;margin-right:6px;padding-right:16px;flex:none;
           border-right:1px solid var(--line)}
  .rc-mark img{display:block;height:52px;width:auto;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
  .rc-mark span{font-size:13px;letter-spacing:2.6px;text-transform:uppercase;
                color:#eef4ff;white-space:nowrap;font-weight:600}
  @media (max-width:880px){
    .rc-mark img{height:36px}
    .rc-mark span{font-size:10px;letter-spacing:1.6px}
    .rc-mark{padding-right:11px;gap:9px}
  }

  /* ---------- side panel ---------- */
  #side{min-width:0;min-height:0;background:linear-gradient(180deg,#0e1524,#0a1120 70%);
        border-left:1px solid var(--line);
        padding:24px 20px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;
        display:flex;flex-direction:column;gap:18px;
        box-shadow:-24px 0 48px -34px #000}
  #side::-webkit-scrollbar{width:9px}
  #side::-webkit-scrollbar-track{background:transparent}
  #side::-webkit-scrollbar-thumb{background:rgba(120,150,195,.2);border-radius:9px;
        border:2px solid transparent;background-clip:padding-box}
  #side::-webkit-scrollbar-thumb:hover{background:rgba(120,150,195,.36);background-clip:padding-box}

  /* 2D lab view — sits on top of the WebGL canvas when a scene is drawn optically */
  #lab2d{position:absolute;inset:0;width:100%;height:100%;display:none}
  #caption{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:none;
           font-size:12.5px;letter-spacing:.2px;padding:8px 16px;border-radius:20px;
           background:rgba(8,12,22,.76);border:1px solid rgba(255,255,255,.14);color:#dbe7f7;
           max-width:78%;text-align:center;line-height:1.5;backdrop-filter:blur(6px);
           -webkit-backdrop-filter:blur(6px)}
  #caption.light{background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.12);color:#1e293b}

  #title{font-size:20px;font-weight:700;letter-spacing:-.022em;line-height:1.24;
         background:linear-gradient(180deg,#ffffff,#c6d9f2);-webkit-background-clip:text;
         background-clip:text;color:transparent}
  #sub{font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.55}

  #eq{background:linear-gradient(90deg,rgba(76,196,247,.12),rgba(76,196,247,.03));
      border-left:3px solid var(--blue);border-radius:0 10px 10px 0;
      padding:13px 15px;font-family:var(--mono);font-size:14px;color:#9fdcff;
      word-break:break-word;letter-spacing:0;line-height:1.5}
  #explain{font-size:13.2px;line-height:1.72;color:#c3d6ef}

  #controls{background:linear-gradient(180deg,#101a2d,#0c1526);border:1px solid var(--line);
            border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:15px;
            box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
  .field{display:flex;flex-direction:column;gap:8px}
  .ftop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12.8px;
        color:#cfdcf1}
  .ftop span{color:var(--blue);font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.2px}

  input[type=range]{width:100%;height:22px;cursor:pointer;-webkit-appearance:none;appearance:none;
                    background:transparent}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;
    background:linear-gradient(90deg,rgba(76,196,247,.55),rgba(76,196,247,.16));
    box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
    width:17px;height:17px;border-radius:50%;margin-top:-6px;
    background:radial-gradient(circle at 34% 30%,#ffffff,#7ed4fb 58%,#2ba3dd);
    border:0;box-shadow:0 2px 8px rgba(0,0,0,.6), 0 0 0 4px rgba(76,196,247,.14);
    transition:box-shadow .18s ease, transform .18s ease}
  input[type=range]:hover::-webkit-slider-thumb{box-shadow:0 2px 10px rgba(0,0,0,.65), 0 0 0 6px rgba(76,196,247,.2)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.08)}
  input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:rgba(76,196,247,.25)}
  input[type=range]::-moz-range-progress{height:5px;border-radius:5px;background:rgba(76,196,247,.6)}
  input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;
    background:radial-gradient(circle at 34% 30%,#ffffff,#7ed4fb 58%,#2ba3dd);
    box-shadow:0 2px 8px rgba(0,0,0,.6)}

  #readouts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .cell{background:linear-gradient(180deg,#0a1220,#070d19);border:1px solid var(--line);
        border-radius:11px;padding:11px 12px;transition:border-color .2s ease, transform .2s ease}
  .cell:hover{border-color:var(--line2);transform:translateY(-1px)}
  .cell .v{font-family:var(--mono);font-size:15px;font-weight:600;color:var(--blue);
           font-variant-numeric:tabular-nums;line-height:1.2;word-break:break-word;letter-spacing:-.01em}
  .cell .k{font-size:10.5px;color:var(--muted2);margin-top:5px;line-height:1.4;letter-spacing:.04em;
           text-transform:uppercase;font-weight:500}
  .cell.perf .v{color:var(--green)}

  .row{display:flex;gap:9px}
  .btn{flex:1;background:linear-gradient(180deg,#101a2c,#0a1220);color:var(--text);
       border:1px solid var(--line);border-radius:11px;padding:11px;font-size:13px;cursor:pointer;
       font-family:inherit;font-weight:500;letter-spacing:.01em;
       transition:background .2s ease, border-color .2s ease, transform .14s ease}
  .btn:hover{background:linear-gradient(180deg,#17253c,#101a2c);border-color:rgba(76,196,247,.45)}
  .btn:active{transform:translateY(1px)}
  .note{font-size:11.5px;color:#66799a;line-height:1.6}

  @media (max-width:880px){
    #split{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
    #stage{min-height:46vh}
    #side{width:100%;max-height:42vh;border-left:0;border-top:1px solid var(--line);
          box-shadow:0 -24px 48px -40px #000}
    #bar{flex-wrap:wrap;padding:11px 13px;gap:9px}
    #hint{display:none}
    #title{font-size:18px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="bar">
  <input id="q" autocomplete="off" placeholder="Search any first-year topic…">
  <button id="go" type="button">Visualize</button>
</div>

<div id="split">
  <div id="stage">
    <canvas id="lab2d"></canvas>
    <div id="fx"></div>
    <div id="grain"></div>
    <div id="caption"></div>
    <div id="status"></div>
    <div id="hint">Drag to orbit · scroll or pinch to zoom · Space pauses · R resets the view</div>
  </div>

  <aside id="side">
    <div>
      <h2 id="title"></h2>
      <div id="sub"></div>
    </div>
    <div id="eq"></div>
    <div id="explain"></div>
    <div id="controls"></div>
    <div id="readouts"></div>
    <div class="row">
      <button class="btn" id="playBtn" type="button">Pause</button>
      <button class="btn" id="viewBtn" type="button">Reset view</button>
    </div>
  </aside>
</div>

function rcMake(id){
  var wrap=document.createElement("div");
  wrap.id=id; wrap.className="rc-mark";
  var img=document.createElement("img");
  img.src=RC_LOGO; img.alt=RC_NAME; img.draggable=false;
  var nm=document.createElement("span");
  nm.textContent=RC_NAME;
  wrap.appendChild(img); wrap.appendChild(nm);
  return wrap;
}
function rcForce(el){
  var st=el.style;
  st.setProperty("display","flex","important");
  st.setProperty("visibility","visible","important");
  st.setProperty("opacity","1","important");
  st.setProperty("align-items","center","important");
  st.setProperty("transform","none","important");
  st.setProperty("filter","none","important");
  st.setProperty("clip-path","none","important");
  var img=el.querySelector("img"), nm=el.querySelector("span");
  if(!img||img.getAttribute("src")!==RC_LOGO||!nm||nm.textContent!==RC_NAME) return false;
  img.style.setProperty("display","block","important");
  img.style.setProperty("opacity","1","important");
  nm.style.setProperty("display","inline","important");
  nm.style.setProperty("opacity","1","important");
  return true;
}
function rcCheck(){
  var bar=document.getElementById("bar");
  if(!bar) return;
  var h=document.getElementById("rcHeader");
  if(!h || h.parentNode!==bar){
    if(h&&h.parentNode) h.parentNode.removeChild(h);
    h=rcMake("rcHeader");
    if(bar.firstElementChild) bar.insertBefore(h, bar.firstElementChild);
    else bar.appendChild(h);
  }
  if(bar.firstElementChild!==h){ bar.insertBefore(h, bar.firstElementChild); }
  if(!rcForce(h)){ h.parentNode.removeChild(h); return rcCheck(); }
  var cs=getComputedStyle(h);
  if(cs.display==="none"||cs.visibility==="hidden"||parseFloat(cs.opacity)<0.85){
    h.parentNode.removeChild(h); return rcCheck();
  }
}

function tidy(src){
  var s = String(src==null?"0":src).trim();
  s = s.replace(/^\s*(?:[a-zA-Z]\s*\([^)]*\)|[a-zA-Z][a-zA-Z0-9_]*)\s*=\s*/, "");
  s = s.replace(/\u2212/g,"-").replace(/\u00d7/g,"*").replace(/\u00f7/g,"/");
  s = s.replace(/(\d)\s*([a-zA-Z(])/g,"$1*$2");
  s = s.replace(/\)\s*([a-zA-Z0-9(])/g,")*$1");
  return s;
}

function toRPN(tokens){

      if(FN1[tk.v]||FN2[tk.v]) stack.push({t:"fn",v:tk.v}); else out.push({t:"var",v:tk.v});
    }
    else if(tk.v===","){ while(stack.length&&stack[stack.length-1].v!=="(") out.push(stack.pop()); }
    else if(tk.v==="("){ stack.push(tk); }
    else if(tk.v===")"){
      while(stack.length&&stack[stack.length-1].v!=="(") out.push(stack.pop());
      stack.pop();
      if(stack.length&&stack[stack.length-1].t==="fn") out.push(stack.pop());
    }
    else{
      var unary=(tk.v==="-"||tk.v==="+")&&(prev===null||(prev.t==="op"&&prev.v!==")"));
      if(unary){ stack.push({t:"op",v:tk.v==="-"?"u-":"u+"}); }
      else{
        while(stack.length){
          var top=stack[stack.length-1];
          if(top.t==="fn"){out.push(stack.pop());continue;}
          if(top.t==="op"){
            var tp = top.v.charAt(0)==="u" ? 2.5 : PREC[top.v];
            if(tp===undefined) break;
            if(tp>PREC[tk.v]||(tp===PREC[tk.v]&&tk.v!=="^")){out.push(stack.pop());continue;}
          }
          break;
        }

var cache={};
function compile(src){

    var sp=0;
    for(var i=0;i<rpn.length;i++){
      var tk=rpn[i],a,b;
      switch(tk.t){
        case "num": st[sp++]=tk.v; break;
        case "var":
          var val=scope[tk.v]; if(val===undefined) val=CONST[tk.v];
          st[sp++]=(typeof val==="number"&&isFinite(val))?val:0; break;

          else {a=st[--sp];st[sp++]=FN1[tk.v](a);} break;
        default:
          if(tk.v==="u-"){st[sp-1]=-st[sp-1];break;}
          if(tk.v==="u+") break;
          b=st[--sp];a=st[--sp];
          if(tk.v==="+")st[sp++]=a+b;
          else if(tk.v==="-")st[sp++]=a-b;
          else if(tk.v==="*")st[sp++]=a*b;
          else if(tk.v==="/")st[sp++]=b===0?0:a/b;
          else if(tk.v==="%")st[sp++]=b===0?0:a%b;
          else st[sp++]=Math.pow(a,b);

}

  return Math.hypot(ptrs[k[0]].x-ptrs[k[1]].x, ptrs[k[0]].y-ptrs[k[1]].y);}

/* tube built once, vertices rewritten every frame — thick, lit, shadowed curves */
function Tube(N, R, radius, color){
  this.N=N; this.R=R; this.radius=radius;
  var count=N*R;
  this.pos=new Float32Array(count*3);
  this.nor=new Float32Array(count*3);
  var idx=[];
  for(var i=0;i<N-1;i++) for(var j=0;j<R;j++){
    var a=i*R+j, b=i*R+((j+1)%R), c=(i+1)*R+j, d=(i+1)*R+((j+1)%R);
    idx.push(a,c,b, b,c,d);
  }
  var g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(this.pos,3));
  g.setAttribute("normal",new THREE.BufferAttribute(this.nor,3));
  g.setIndex(idx);
  this.geo=g;
  this.mesh=new THREE.Mesh(g, std(color,{roughness:0.28,metalness:0.45,emissiveIntensity:0.3}));
  this.mesh.castShadow=true;
  this._t=new THREE.Vector3(); this._n=new THREE.Vector3(); this._b=new THREE.Vector3();
  this._up=new THREE.Vector3(0,1,0); this._alt=new THREE.Vector3(1,0,0);
}
Tube.prototype.update=function(pts){   // pts: Float32Array(N*3)
  var N=this.N, R=this.R, rad=this.radius, t=this._t, n=this._n, b=this._b;
  for(var i=0;i<N;i++){
    var i0=Math.max(0,i-1), i1=Math.min(N-1,i+1);
    t.set(pts[i1*3]-pts[i0*3], pts[i1*3+1]-pts[i0*3+1], pts[i1*3+2]-pts[i0*3+2]);
    if(t.lengthSq()<1e-12) t.set(1,0,0); else t.normalize();
    var up = Math.abs(t.y)>0.9 ? this._alt : this._up;
    n.crossVectors(t,up).normalize();
    b.crossVectors(t,n).normalize();
    for(var j=0;j<R;j++){
      var a=(j/R)*Math.PI*2, ca=Math.cos(a), sa=Math.sin(a), k=(i*R+j)*3;
      var nx=n.x*ca+b.x*sa, ny=n.y*ca+b.y*sa, nz=n.z*ca+b.z*sa;
      this.nor[k]=nx; this.nor[k+1]=ny; this.nor[k+2]=nz;
      this.pos[k]=pts[i*3]+nx*rad; this.pos[k+1]=pts[i*3+1]+ny*rad; this.pos[k+2]=pts[i*3+2]+nz*rad;
    }
  }
  this.geo.attributes.position.needsUpdate=true;
  this.geo.attributes.normal.needsUpdate=true;
  this.geo.computeBoundingSphere();

var PALETTE=["#38bdf8","#f43f5e","#34d399","#fbbf24","#a78bfa","#f472b6"];

/* --- curves: y = f(x,t,a..d) --- */
function buildCurves(spec){
  var cfg=spec.curve||{}, range=cfg.range||[-8,8];
  var items=(cfg.items&&cfg.items.length)?cfg.items:[{expr:"sin(x)"}];
  var N=180, built=[];
  for(var i=0;i<Math.min(items.length,5);i++){
    var it=items[i], col=it.color||PALETTE[i%PALETTE.length];
    var tube=new Tube(N,10,it.thin?0.06:0.15,col);
    world.add(tube.mesh);
    var lb=it.label?label(it.label,col,0.55):null; if(lb) world.add(lb);
    built.push({f:compile(it.expr),pts:new Float32Array(N*3),tube:tube,plane:it.plane||"xy",lb:lb});
  }
  var dec=cfg.decorate||null, tan=null, rie=null;
  if(dec&&dec.kind==="tangent"){
    var tt=new Tube(2,8,0.06,"#fbbf24"); world.add(tt.mesh);
    var dot=new THREE.Mesh(new THREE.SphereGeometry(0.22,24,24), std("#fbbf24",{emissiveIntensity:0.8}));
    dot.castShadow=true; world.add(dot); world.add(glow("#fbbf24",1.6));
    tan={tube:tt,pts:new Float32Array(6),dot:dot,at:dec.at||"a",halo:world.children[world.children.length-1],
         chord:dec.chord||null};
    if(tan.chord){
      tan.ct=new Tube(2,8,0.06,"#a78bfa"); world.add(tan.ct.mesh);
      tan.cpts=new Float32Array(6);
      tan.ea=new THREE.Mesh(new THREE.SphereGeometry(0.19,20,20), std("#a78bfa",{emissiveIntensity:0.6}));
      tan.eb=new THREE.Mesh(new THREE.SphereGeometry(0.19,20,20), std("#a78bfa",{emissiveIntensity:0.6}));
      world.add(tan.ea,tan.eb);
    }
  }
  if(dec&&dec.kind==="riemann"){
    var grp=new THREE.Group(); world.add(grp);
    var bgeo=new THREE.BoxGeometry(1,1,1);
    rie={grp:grp,from:dec.from===undefined?range[0]:dec.from,to:dec.to===undefined?range[1]:dec.to,
         nVar:dec.n||"a",meshes:[]};
    for(var b=0;b<60;b++){
      var m=new THREE.Mesh(bgeo, std("#34d399",{roughness:0.5,metalness:0.1,emissiveIntensity:0.12}));
      m.material.transparent=true; m.material.opacity=0.55; m.castShadow=true; m.visible=false;
      grp.add(m); rie.meshes.push(m);
    }
  }
  return { update:function(t,scope){
    var extra=[], lo=range[0], hi=range[1], i, j, x, v;
    for(i=0;i<built.length;i++){
      var c=built[i];
      for(j=0;j<N;j++){
        x=lo+(hi-lo)*j/(N-1); scope.x=x; v=clamp(c.f(scope),-40,40);
        if(c.plane==="xz"){c.pts[j*3]=x;c.pts[j*3+1]=0;c.pts[j*3+2]=v;}
        else {c.pts[j*3]=x;c.pts[j*3+1]=v;c.pts[j*3+2]=0;}
      }
      c.tube.update(c.pts);
      if(c.lb) c.lb.position.set(hi+0.6, c.pts[(N-1)*3+1], c.pts[(N-1)*3+2]);
    }
    if(tan){
      var f0=built[0].f, x0=clamp(scope[tan.at]===undefined?1:scope[tan.at],lo,hi), h=0.001;
      scope.x=x0; var y0=f0(scope);
      scope.x=x0+h; var yp=f0(scope); scope.x=x0-h; var ym=f0(scope);
      var slope=(yp-ym)/(2*h), L=(hi-lo)*0.2;
      tan.pts[0]=x0-L; tan.pts[1]=y0-slope*L; tan.pts[2]=0;
      tan.pts[3]=x0+L; tan.pts[4]=y0+slope*L; tan.pts[5]=0;
      tan.tube.update(tan.pts);
      tan.dot.position.set(x0,y0,0); tan.halo.position.set(x0,y0,0);
      extra.push(["Slope f\u2032(x)",slope.toFixed(3),"at x = "+x0.toFixed(2)]);
      if(tan.chord){
        var ca=tan.chord[0], cb=tan.chord[1];
        scope.x=ca; var ya=f0(scope); scope.x=cb; var yb=f0(scope);
        tan.cpts[0]=ca; tan.cpts[1]=ya; tan.cpts[2]=0;
        tan.cpts[3]=cb; tan.cpts[4]=yb; tan.cpts[5]=0;
        tan.ct.update(tan.cpts);
        tan.ea.position.set(ca,ya,0); tan.eb.position.set(cb,yb,0);
        var cs=(yb-ya)/(cb-ca);
        extra.push(["Chord slope",cs.toFixed(3),"joining the endpoints"]);
        extra.push(["Difference",(slope-cs).toFixed(3),"zero at the guaranteed c"]);
      }
    }

      var w=(rie.to-rie.from)/nB, sum=0, fR=built[0].f;

    }

  }};
}

/* --- surface: cartesian z=f(x,y) or spherical r=f(u,v) --- */
function buildSurface(spec){

  var R=Math.round(clamp(cfg.res||64,12,100));
  var count=R*R, pos=new Float32Array(count*3), col=new Float32Array(count*3);
  var idx=[];
  for(var a=0;a<R-1;a++) for(var b=0;b<R-1;b++){
    var i0=a*R+b; idx.push(i0,i0+1,i0+R, i0+1,i0+R+1,i0+R);
  }

    roughness:0.34,metalness:0.28,envMapIntensity:1.2,emissive:0x0a1a2c,emissiveIntensity:0.35});
  var mesh=new THREE.Mesh(g,mat); mesh.castShadow=true; mesh.receiveShadow=true;
  world.add(mesh);
  var wire=new THREE.Mesh(g,new THREE.MeshBasicMaterial({color:0x04080f,wireframe:true,transparent:true,opacity:0.18}));
  world.add(wire);
  var cLo=new THREE.Color("#1e3a8a"), cMid=new THREE.Color("#38bdf8"), cHi=new THREE.Color("#fbbf24");
  var tmp=new THREE.Color(), vals=new Float64Array(count);

        var vv=Math.PI*a2/(R-1);

  }};
}

/* --- parametric space curve --- */
function buildParametric(spec){
  var cfg=spec.parametric||{};
  var fx=compile(cfg.x||"cos(s)"), fy=compile(cfg.y||"sin(s)"), fz=compile(cfg.z||"0.2*s");
  var tr=cfg.srange||cfg.trange||[0,25];
  var N=Math.round(clamp(cfg.res||600,50,1600));
  var pts=new Float32Array(N*3);
  var tube=new Tube(N,9,cfg.radius||0.09,"#38bdf8"); world.add(tube.mesh);
  var head=new THREE.Mesh(new THREE.SphereGeometry(0.26,26,26), std("#fbbf24",{emissiveIntensity:0.9}));
  head.castShadow=true; world.add(head);
  var halo=glow("#fbbf24",2.0); world.add(halo);
  return { update:function(t,scope){
    var lo=tr[0], hi=tr[1];
    for(var i=0;i<N;i++){

      pts[i*3+1]=clamp(fy(scope),-30,30);

    tube.update(pts);
    var k=Math.floor(((t*0.14)%1)*(N-1));
    head.position.set(pts[k*3],pts[k*3+1],pts[k*3+2]);
    halo.position.copy(head.position);

/* --- vector field with real arrow heads --- */
function buildField(spec){
  var cfg=spec.field||{};

  var B=cfg.bounds||5, st=cfg.step||1.9, pts=[];
  for(var x=-B;x<=B+1e-6;x+=st) for(var y=-B;y<=B+1e-6;y+=st) for(var z=-B;z<=B+1e-6;z+=st) pts.push([x,y,z]);
  var n=pts.length;
  var shaftGeo=new THREE.CylinderGeometry(0.035,0.035,1,6,1,true);
  shaftGeo.translate(0,0.5,0);
  var headGeo=new THREE.ConeGeometry(0.11,0.28,10);
  headGeo.translate(0,0.14,0);
  var mat=std("#38bdf8",{roughness:0.3,metalness:0.5,emissiveIntensity:0.35});
  var shafts=new THREE.InstancedMesh(shaftGeo,mat,n);
  var heads=new THREE.InstancedMesh(headGeo,mat.clone(),n);
  shafts.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  heads.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  shafts.castShadow=true; heads.castShadow=true;
  world.add(shafts,heads);
  var dummy=new THREE.Object3D(), up=new THREE.Vector3(0,1,0), dir=new THREE.Vector3();
  var cA=new THREE.Color("#1d4ed8"), cB=new THREE.Color("#38bdf8"), cC=new THREE.Color("#f43f5e"), tc=new THREE.Color();
  var vecs=new Float64Array(n*3);

  return { update:function(t,scope){
    var i, maxM=1e-6;
    for(i=0;i<n;i++){
      scope.x=pts[i][0]; scope.y=pts[i][1]; scope.z=pts[i][2];
      var vx=clamp(fx(scope),-1e4,1e4), vy=clamp(fy(scope),-1e4,1e4), vz=clamp(fz(scope),-1e4,1e4);
      vecs[i*3]=vx; vecs[i*3+1]=vy; vecs[i*3+2]=vz;
      var m=Math.hypot(vx,vy,vz); if(m>maxM)maxM=m;

    for(i=0;i<n;i++){
      var p=pts[i], vx2=vecs[i*3], vy2=vecs[i*3+1], vz2=vecs[i*3+2];

      dummy.scale.set(1,Math.max(L,0.02),1);
      dummy.updateMatrix(); shafts.setMatrixAt(i,dummy.matrix);
      dummy.position.set(p[0]+dir.x*L, p[1]+dir.y*L, p[2]+dir.z*L);
      dummy.scale.set(1,1,1); dummy.updateMatrix(); heads.setMatrixAt(i,dummy.matrix);
      if(u<0.5) tc.copy(cA).lerp(cB,u*2); else tc.copy(cB).lerp(cC,(u-0.5)*2);

    if(shafts.instanceColor) shafts.instanceColor.needsUpdate=true;
    if(heads.instanceColor) heads.instanceColor.needsUpdate=true;

  }};

/* --- graph / tree / flowchart / network --- */
function buildGraph(spec){
  var cfg=spec.graph||{};
  var labels=cfg.nodes||["A","B","C"], edges=(cfg.edges||[]).slice(), layout=cfg.layout||"tree";
  var P=[], i, j;
  if(layout==="tree"){
    var depth=Math.floor(Math.log(labels.length)/Math.LN2)+1;
    for(i=0;i<labels.length;i++){
      var d=Math.floor(Math.log(i+1)/Math.LN2), first=Math.pow(2,d)-1, ix=i-first, rowN=Math.pow(2,d);
      P.push([(ix-(rowN-1)/2)*(15/rowN), 5.5-d*(10/Math.max(depth,2)), 0]);
    }
    if(!edges.length) for(i=1;i<labels.length;i++) edges.push([Math.floor((i-1)/2),i]);
  } else if(layout==="layered"){
    var layers=cfg.layers||[labels.length], k=0;
    for(i=0;i<layers.length;i++) for(j=0;j<layers[i];j++){
      if(k>=labels.length)break;
      P.push([(i-(layers.length-1)/2)*5.5,(j-(layers[i]-1)/2)*2.5,0]); k++;
    }
    if(!edges.length){
      var off=0;
      for(i=0;i<layers.length-1;i++){
        for(j=0;j<layers[i];j++) for(var m=0;m<layers[i+1];m++) edges.push([off+j,off+layers[i]+m]);
        off+=layers[i];
      }
    }
  } else if(layout==="line"){
    for(i=0;i<labels.length;i++) P.push([(i-(labels.length-1)/2)*2.9,0,0]);
    if(!edges.length) for(i=1;i<labels.length;i++) edges.push([i-1,i]);
  } else if(layout==="flow"){
    for(i=0;i<labels.length;i++) P.push([0,6.5-i*(13/Math.max(labels.length-1,1)),0]);
    if(!edges.length) for(i=1;i<labels.length;i++) edges.push([i-1,i]);
  } else {
    for(i=0;i<labels.length;i++){
      var ang=(i/labels.length)*Math.PI*2;
      P.push([Math.cos(ang)*6,Math.sin(ang)*6,Math.sin(ang*2)*1.4]);
    }
  }
  if(cfg.positions) for(i=0;i<cfg.positions.length&&i<P.length;i++) P[i]=cfg.positions[i];

  var edgeMat=new THREE.MeshStandardMaterial({color:0x2c4468,roughness:0.6,metalness:0.3});
  var cylGeo=new THREE.CylinderGeometry(0.045,0.045,1,8);
  cylGeo.translate(0,0.5,0);
  var up=new THREE.Vector3(0,1,0), dir=new THREE.Vector3();
  for(i=0;i<edges.length;i++){
    var A=P[edges[i][0]], Bp=P[edges[i][1]];
    if(!A||!Bp) continue;
    var mesh=new THREE.Mesh(cylGeo,edgeMat);
    dir.set(Bp[0]-A[0],Bp[1]-A[1],Bp[2]-A[2]);
    var len=dir.length()||0.001; dir.normalize();
    mesh.position.set(A[0],A[1],A[2]);
    mesh.quaternion.setFromUnitVectors(up,dir);
    mesh.scale.set(1,len,1);
    world.add(mesh);
  }
  var nodeGeo=new THREE.SphereGeometry(0.5,26,26), meshes=[];
  for(i=0;i<P.length;i++){
    var ms=new THREE.Mesh(nodeGeo, std("#1e3a5f",{roughness:0.3,metalness:0.4,emissive:"#0d2137",emissiveIntensity:0.4}));
    ms.position.set(P[i][0],P[i][1],P[i][2]); ms.castShadow=true; world.add(ms);
    var lb=label(String(labels[i]),"#eef4ff",0.55);
    lb.position.set(P[i][0],P[i][1]+0.92,P[i][2]); world.add(lb);
    meshes.push(ms);
  }
  var order=cfg.order||null;
  var onCol=new THREE.Color("#fbbf24"), offCol=new THREE.Color("#1e3a5f");
  var onEm=new THREE.Color("#a16207"), offEm=new THREE.Color("#0d2137");

  return { update:function(t,scope){
    if(!order||!order.length)
      return [["Nodes",String(labels.length),"In this structure"],["Edges",String(edges.length),"Connections"]];
    var sp=scope.a===undefined?1:clamp(scope.a,0.1,5);
    var stepI=Math.floor(t*sp)%(order.length+2);
    for(var i2=0;i2<meshes.length;i2++){
      var pos=order.indexOf(i2), on=pos>=0&&pos<stepI;
      meshes[i2].material.color.copy(on?onCol:offCol);
      meshes[i2].material.emissive.copy(on?onEm:offEm);

    var cur=(stepI>0&&stepI<=order.length)?labels[order[stepI-1]]:"\u2014";
    return [["Now at",String(cur),cfg.orderName||"Sequence"],
            ["Step",Math.min(stepI,order.length)+" / "+order.length,"Progress"]];
  }};
}

/* --- bars / sorting --- */
function buildBars(spec){
  var cfg=spec.bars||{};

  if(cfg.algorithm){
    var w=values.slice(), swapped=true, guard=0;
    while(swapped&&guard++<300&&frames.length<420){
      swapped=false;
      for(var i=0;i<w.length-1&&frames.length<420;i++){
        frames.push(w.slice()); marks.push([i,i+1]);
        if(w[i]>w[i+1]){var tv=w[i];w[i]=w[i+1];w[i+1]=tv;swapped=true;}
      }
    }
    frames.push(w.slice()); marks.push([-1,-1]);
  }

  for(var b=0;b<n;b++){
    var m=new THREE.Mesh(boxGeo, std("#38bdf8",{roughness:0.3,metalness:0.45,emissiveIntensity:0.25}));
    m.castShadow=true; m.receiveShadow=true; world.add(m); meshes.push(m);

      var on=(i2===mk[0]||i2===mk[1]);

      meshes[i2].material.emissive.copy(on?hot:cool);

    return [["Step",(fi+1)+" / "+frames.length,cfg.algorithm?"Comparisons":"Static data"],
            ["Comparing",mk[0]>=0?("index "+mk[0]+" & "+mk[1]):"finished","Highlighted pair"]];
  }};
}

/* --- linear transformation of space --- */

  for(i=0;i<pairs.length;i++){

  world.add(new THREE.LineSegments(og,new THREE.LineBasicMaterial({color:0x38bdf8})));

  world.add(iHat.mesh,jHat.mesh);

  var li=label("i","#34d399",0.6), lj=label("j","#f43f5e",0.6);
  world.add(li,lj);

    li.position.set(a*1.15,0.5,c*1.15); lj.position.set(b*1.15,0.5,d*1.15);
    var det=a*d-b*c;
    return [["Determinant",det.toFixed(3),"Area scale factor"],
            ["Orientation",det<0?"flipped":(Math.abs(det)<1e-6?"collapsed":"preserved"),"Sign of det"]];
  }};
}

/* --- lab view: a real optical pattern drawn pixel by pixel on 2D canvas --- */
var labCanvas=document.getElementById("lab2d"), labCtx=labCanvas.getContext("2d");
var offCanvas=document.createElement("canvas"), offCtx=offCanvas.getContext("2d");
var elCaption=document.getElementById("caption");

/* CIE-ish wavelength to linear RGB, good enough to look right on screen */
function wavelengthRGB(nm){
  var R=0,G=0,B=0;
  if(nm>=380&&nm<440){R=-(nm-440)/60;B=1;}
  else if(nm<490){G=(nm-440)/50;B=1;}
  else if(nm<510){G=1;B=-(nm-510)/20;}
  else if(nm<580){R=(nm-510)/70;G=1;}
  else if(nm<645){R=1;G=-(nm-645)/65;}
  else if(nm<=830){R=1;}
  var f=1;
  if(nm<420) f=0.35+0.65*(nm-380)/40;
  else if(nm>700) f=0.35+0.65*(830-nm)/130;
  return [Math.max(R,0)*f, Math.max(G,0)*f, Math.max(B,0)*f];
}

/* small schematic of the bench, drawn rather than downloaded so it always appears */
function drawApparatus(ctx, kind, W, H, dark){
  var w=210, h=136, x=16, y=H-h-16;
  ctx.save();
  ctx.fillStyle = dark ? "rgba(8,12,22,.78)" : "rgba(255,255,255,.85)";
  ctx.strokeStyle = dark ? "rgba(255,255,255,.14)" : "rgba(0,0,0,.14)";
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.rect(x,y,w,h); ctx.fill(); ctx.stroke();
  var ink = dark ? "#c8d8ee" : "#1f2937";
  var accent = dark ? "#7dd3fc" : "#0284c7";
  ctx.strokeStyle=ink; ctx.fillStyle=ink;
  ctx.font="10px Inter, Arial, sans-serif";
  ctx.lineWidth=1.4;

  if(kind==="newton"){
    var bx=x+22, by=y+96, bw=w-44;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+bw,by); ctx.stroke();        // glass plate
    ctx.beginPath(); ctx.moveTo(bx+8,by+8); ctx.lineTo(bx+bw-8,by+8); ctx.stroke();
    ctx.beginPath();                                                               // plano-convex lens
    ctx.moveTo(bx+22,by); ctx.quadraticCurveTo(bx+bw/2,by-46,bx+bw-22,by); ctx.stroke();
    ctx.strokeStyle=accent; ctx.lineWidth=1.1;
    for(var i=0;i<4;i++){
      var px=bx+40+i*26;
      ctx.beginPath(); ctx.moveTo(px,y+18); ctx.lineTo(px,by-2); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(bx+bw/2,y+18); ctx.lineTo(bx+bw/2+34,y+6); ctx.stroke();
    ctx.fillStyle=ink;
    ctx.fillText("microscope",x+w-74,y+14);
    ctx.fillText("plano-convex lens",x+10,y+70);
    ctx.fillText("optical flat",x+10,y+124);
  } else if(kind==="slits"){
    var sx=x+26;
    ctx.strokeStyle=accent;
    ctx.beginPath(); ctx.arc(sx,y+h/2,5,0,6.3); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+6,y+h/2); ctx.lineTo(sx+52,y+h/2-16); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+6,y+h/2); ctx.lineTo(sx+52,y+h/2+16); ctx.stroke();
    ctx.strokeStyle=ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx+56,y+20); ctx.lineTo(sx+56,y+h/2-18); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+56,y+h/2-12); ctx.lineTo(sx+56,y+h/2+12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+56,y+h/2+18); ctx.lineTo(sx+56,y+h-20); ctx.stroke();
    ctx.strokeStyle=accent; ctx.lineWidth=1;
    for(var j=-3;j<=3;j++){
      ctx.beginPath(); ctx.moveTo(sx+58,y+h/2-15); ctx.lineTo(x+w-22,y+h/2+j*13); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx+58,y+h/2+15); ctx.lineTo(x+w-22,y+h/2+j*13); ctx.stroke();
    }
    ctx.strokeStyle=ink; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(x+w-20,y+16); ctx.lineTo(x+w-20,y+h-16); ctx.stroke();
    ctx.fillStyle=ink;
    ctx.fillText("source",x+10,y+h/2-12);
    ctx.fillText("screen",x+w-52,y+h-4);
  }
  ctx.restore();
}

function buildLab(spec){
  var cfg=spec.lab||{};
  var f=compile(cfg.expr||"sin(pi*r*r)^2");
  var axis=cfg.axis||"r";                      // "r" | "x" | "xy"
  var extent=cfg.extent||4;                    // half-height of the view, physical units
  var white=!!cfg.white;
  var lamSrc=cfg.lam===undefined?589:cfg.lam;  // control name or a number in nm
  var lams=white?[420,445,470,495,520,545,570,595,620,645,670]:null;
  var bg=cfg.background||"#04070d";
  var darkBg=(function(){
    var c=bg.replace("#",""); if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
    var n=parseInt(c,16);
    return (((n>>16&255)*0.30+(n>>8&255)*0.59+(n&255)*0.11)/255)<0.5;
  })();
  var gamma=cfg.gamma||0.72;
  var lastKey="", usesTime=/\bt\b/.test(tidy(cfg.expr||""));

  labCanvas.style.display="block";
  renderer.domElement.style.display="none";
  stage.style.background=bg;
  if(cfg.caption){ elCaption.textContent=cfg.caption; elCaption.style.display="block";
                   elCaption.classList.toggle("light",!darkBg); }
  else elCaption.style.display="none";

  function lut(n, lo, hi, lam, scope){
    var arr=new Float32Array(n);
    for(var i=0;i<n;i++){
      var q=lo+(hi-lo)*i/(n-1);
      if(axis==="r"){scope.r=q; scope.x=q; scope.y=0;} else {scope.x=q; scope.r=Math.abs(q); scope.y=0;}
      scope.lam=lam;
      arr[i]=clamp(f(scope),0,1);
    }
    return arr;
  }

  function repaint(scope){
    var W=stage.clientWidth||1, H=stage.clientHeight||1;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    labCanvas.width=Math.round(W*dpr); labCanvas.height=Math.round(H*dpr);
    labCanvas.style.width=W+"px"; labCanvas.style.height=H+"px";

    var cap = axis==="xy" ? 300 : 620;
    var cw=Math.max(60,Math.min(Math.round(W),cap)), ch=Math.max(60,Math.min(Math.round(H),cap));
    offCanvas.width=cw; offCanvas.height=ch;
    var img=offCtx.createImageData(cw,ch), data=img.data;

    var scale=(2*extent)/Math.min(cw,ch);       // physical units per pixel
    var cx=cw/2, cy=ch/2;
    var maxR=Math.hypot(cw,ch)*0.5*scale;
    var i,j,k,px,py,I,rgb,rr,gg,bb;

    var tables=[], base=[];
    if(axis!=="xy"){
      var n=1400;
      if(white){ for(k=0;k<lams.length;k++){ tables.push(lut(n, axis==="r"?0:-maxR, maxR, lams[k], scope)); base.push(wavelengthRGB(lams[k])); } }
      else { tables.push(lut(n, axis==="r"?0:-maxR, maxR, scope.lam, scope)); base.push(wavelengthRGB(scope.lam)); }
      var lo=axis==="r"?0:-maxR, span=maxR-lo;
      for(j=0;j<ch;j++){
        py=(j-cy)*scale;
        for(i=0;i<cw;i++){
          px=(i-cx)*scale;
          var q = axis==="r" ? Math.hypot(px,py) : px;
          var idx=Math.round(((q-lo)/span)*(n-1));
          if(idx<0)idx=0; if(idx>n-1)idx=n-1;
          rr=0;gg=0;bb=0;
          for(k=0;k<tables.length;k++){
            I=tables[k][idx];
            rr+=base[k][0]*I; gg+=base[k][1]*I; bb+=base[k][2]*I;
          }
          if(tables.length>1){ rr/=tables.length*0.55; gg/=tables.length*0.55; bb/=tables.length*0.55; }
          var o=(j*cw+i)*4;
          data[o]=Math.min(255,Math.pow(Math.min(rr,1),gamma)*255);
          data[o+1]=Math.min(255,Math.pow(Math.min(gg,1),gamma)*255);
          data[o+2]=Math.min(255,Math.pow(Math.min(bb,1),gamma)*255);
          data[o+3]=255;
        }
      }
    } else {
      var mono=wavelengthRGB(scope.lam);
      for(j=0;j<ch;j++){
        for(i=0;i<cw;i++){
          scope.x=(i-cx)*scale; scope.y=(j-cy)*scale; scope.r=Math.hypot(scope.x,scope.y);
          I=clamp(f(scope),0,1);
          var o2=(j*cw+i)*4, g2=Math.pow(I,gamma);
          data[o2]=Math.min(255,mono[0]*g2*255);
          data[o2+1]=Math.min(255,mono[1]*g2*255);
          data[o2+2]=Math.min(255,mono[2]*g2*255);
          data[o2+3]=255;
        }
      }
    }

    /* a little grain and a soft field stop so it reads as an observed image */
    if(cfg.grain!==false){
      for(k=0;k<data.length;k+=4){
        var nz=(Math.random()-0.5)*11;
        data[k]=clamp(data[k]+nz,0,255); data[k+1]=clamp(data[k+1]+nz,0,255); data[k+2]=clamp(data[k+2]+nz,0,255);
      }
    }
    offCtx.putImageData(img,0,0);

    labCtx.save();
    labCtx.scale(dpr,dpr);
    labCtx.fillStyle=bg; labCtx.fillRect(0,0,W,H);
    labCtx.imageSmoothingEnabled=true; labCtx.imageSmoothingQuality="high";
    labCtx.drawImage(offCanvas,0,0,W,H);

    if(cfg.fieldStop!==false){
      var R0=Math.min(W,H)*0.46;
      var vg=labCtx.createRadialGradient(W/2,H/2,R0*0.72,W/2,H/2,R0*1.28);
      vg.addColorStop(0,"rgba(0,0,0,0)");
      vg.addColorStop(1,darkBg?"rgba(2,4,9,.96)":"rgba(236,240,247,.96)");
      labCtx.fillStyle=vg; labCtx.fillRect(0,0,W,H);
    }
    if(cfg.overlay==="crosshair"){
      labCtx.strokeStyle=darkBg?"rgba(226,240,255,.5)":"rgba(15,23,42,.5)";
      labCtx.lineWidth=1;
      labCtx.beginPath(); labCtx.moveTo(W/2,H*0.18); labCtx.lineTo(W/2,H*0.82); labCtx.stroke();
      labCtx.beginPath(); labCtx.moveTo(W*0.5-Math.min(W,H)*0.32,H/2); labCtx.lineTo(W*0.5+Math.min(W,H)*0.32,H/2); labCtx.stroke();
    }
    if(cfg.apparatus) drawApparatus(labCtx,cfg.apparatus,W,H,darkBg);

    /* scale bar so the numbers in the panel mean something */
    var barPhys=cfg.unitStep|| (extent>=15?5:1);
    var barPx=(barPhys/(2*extent))*Math.min(W,H);
    labCtx.strokeStyle=darkBg?"rgba(226,240,255,.75)":"rgba(15,23,42,.75)";
    labCtx.fillStyle=labCtx.strokeStyle; labCtx.lineWidth=2;
    var bx0=30, by0=32;
    labCtx.beginPath(); labCtx.moveTo(bx0,by0); labCtx.lineTo(bx0+barPx,by0); labCtx.stroke();
    labCtx.beginPath(); labCtx.moveTo(bx0,by0-4); labCtx.lineTo(bx0,by0+4); labCtx.stroke();
    labCtx.beginPath(); labCtx.moveTo(bx0+barPx,by0-4); labCtx.lineTo(bx0+barPx,by0+4); labCtx.stroke();
    labCtx.font="11px Inter, Arial, sans-serif"; labCtx.textAlign="center";
    labCtx.fillText(barPhys+" "+(cfg.unit||"mm"), bx0+barPx/2, by0-9);
    labCtx.restore();
  }

  return { lab:true, update:function(t,scope){
    scope.lam = (typeof lamSrc==="number") ? lamSrc : (scope[lamSrc]===undefined?589:scope[lamSrc]);
    var key=[scope.a,scope.b,scope.c,scope.d,scope.lam,stage.clientWidth,stage.clientHeight,
             usesTime?Math.round(t*12):0].join("|");
    if(key!==lastKey){ lastKey=key; repaint(scope); }
    var out=[];
    if(!white) out.push(["Wavelength",Math.round(scope.lam)+" nm","Illumination"]);
    else out.push(["Illumination","white","400\u2013670 nm composite"]);
    return out;
  }};
}


/* ============================================================
   scene2d - declarative 2D diagrams. Every coordinate is an
   expression in t and a..d, so circuits, cross-sections and
   machine cycles animate and respond to sliders like 3D scenes.
   ============================================================ */
var INK={ ink:"#dce8f8", dim:"#7f94b4", line:"#4a6285", accent:"#38bdf8", warn:"#f43f5e",
          ok:"#34d399", gold:"#fbbf24", violet:"#a78bfa", wire:"#93a9c9" };

function E(v, scope, dflt){
  if(typeof v==="number") return v;
  if(v===undefined||v===null) return dflt===undefined?0:dflt;
  return compile(v)(scope);
}
function interp(str, scope){
  return String(str).replace(/\{([^}]+)\}/g, function(_,ex){
    var v=compile(ex)(scope);
    if(!isFinite(v)) return "\u2014";
    if(Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0)) return v.toExponential(2);
    return String(Math.round(v*1000)/1000);
  });
}

function drawSym(ctx, name, cx, cy, u, rot, color, label, value){
  ctx.save(); ctx.translate(cx,cy);
  if(rot) ctx.rotate(rot*Math.PI/180);
  ctx.lineWidth=Math.max(1.1,u*0.075);
  ctx.strokeStyle=color||INK.wire; ctx.fillStyle=color||INK.wire;
  ctx.lineCap="round"; ctx.lineJoin="round";
  function L(x1,y1,x2,y2){ctx.beginPath();ctx.moveTo(x1*u,y1*u);ctx.lineTo(x2*u,y2*u);ctx.stroke();}
  function C(x,y,r,fill){ctx.beginPath();ctx.arc(x*u,y*u,r*u,0,6.2832);if(fill)ctx.fill();else ctx.stroke();}
  var i;
  if(name==="res"){
    L(-1.4,0,-0.7,0); L(0.7,0,1.4,0);
    ctx.beginPath(); ctx.moveTo(-0.7*u,0);
    for(i=0;i<6;i++) ctx.lineTo((-0.7+0.2333*(i+0.5))*u,(i%2?0.3:-0.3)*u);
    ctx.lineTo(0.7*u,0); ctx.stroke();
  } else if(name==="cap"){
    L(-1.4,0,-0.18,0); L(0.18,0,1.4,0); L(-0.18,-0.55,-0.18,0.55); L(0.18,-0.55,0.18,0.55);
  } else if(name==="ind"){
    L(-1.4,0,-0.88,0); L(0.88,0,1.4,0);
    ctx.beginPath(); for(i=0;i<4;i++) ctx.arc((-0.66+i*0.44)*u,0,0.22*u,Math.PI,0); ctx.stroke();
  } else if(name==="diode"){
    L(-1.4,0,-0.35,0); L(0.35,0,1.4,0);
    ctx.beginPath(); ctx.moveTo(-0.35*u,-0.45*u); ctx.lineTo(-0.35*u,0.45*u); ctx.lineTo(0.35*u,0);
    ctx.closePath(); ctx.fill(); L(0.35,-0.5,0.35,0.5);
  } else if(name==="vsrc"||name==="vac"||name==="isrc"){
    L(-1.4,0,-0.58,0); L(0.58,0,1.4,0); C(0,0,0.58);
    if(name==="vsrc"){ L(-0.32,-0.2,-0.08,-0.2); L(-0.2,-0.32,-0.2,-0.08); L(0.08,0.2,0.32,0.2); }
    else if(name==="vac"){
      ctx.beginPath();
      for(i=0;i<=20;i++) ctx.lineTo((-0.34+0.034*i)*u, -0.22*u*Math.sin(i/20*Math.PI*2));
      ctx.stroke();
    } else { L(0,0.3,0,-0.22);
      ctx.beginPath(); ctx.moveTo(0,-0.38*u); ctx.lineTo(-0.13*u,-0.12*u); ctx.lineTo(0.13*u,-0.12*u);
      ctx.closePath(); ctx.fill(); }
  } else if(name==="gnd"){
    L(0,-0.9,0,0); L(-0.55,0,0.55,0); L(-0.34,0.26,0.34,0.26); L(-0.14,0.5,0.14,0.5);
  } else if(name==="npn"||name==="pnp"){
    C(0,0,0.78); L(-1.6,0,-0.2,0); L(-0.2,-0.5,-0.2,0.5);
    L(-0.2,-0.26,0.5,-0.66); L(0.5,-0.66,0.5,-1.6);
    L(-0.2,0.26,0.5,0.66); L(0.5,0.66,0.5,1.6);
    ctx.beginPath();
    if(name==="npn"){ ctx.moveTo(0.5*u,0.66*u); ctx.lineTo(0.2*u,0.42*u); ctx.lineTo(0.34*u,0.7*u); }
    else { ctx.moveTo(-0.2*u,0.26*u); ctx.lineTo(0.1*u,0.2*u); ctx.lineTo(0.0*u,0.5*u); }
    ctx.closePath(); ctx.fill();
  } else if(name==="opamp"){
    ctx.beginPath(); ctx.moveTo(-0.85*u,-1*u); ctx.lineTo(-0.85*u,1*u); ctx.lineTo(1*u,0);
    ctx.closePath(); ctx.stroke();
    L(-1.7,-0.5,-0.85,-0.5); L(-1.7,0.5,-0.85,0.5); L(1,0,1.8,0);
    ctx.font="600 "+(u*0.44)+"px Inter, Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText("\u2212",-0.6*u,-0.5*u); ctx.fillText("+",-0.6*u,0.5*u);
  } else if(name==="xfmr"){
    ctx.beginPath(); for(i=0;i<4;i++) ctx.arc(-0.34*u,(-0.66+i*0.44)*u,0.22*u,Math.PI*1.5,Math.PI*0.5); ctx.stroke();
    ctx.beginPath(); for(i=0;i<4;i++) ctx.arc(0.34*u,(-0.66+i*0.44)*u,0.22*u,Math.PI*0.5,Math.PI*1.5); ctx.stroke();
    L(-0.09,-1.05,-0.09,1.05); L(0.09,-1.05,0.09,1.05);
    L(-1.5,-0.88,-0.56,-0.88); L(-1.5,0.88,-0.56,0.88);
    L(0.56,-0.88,1.5,-0.88); L(0.56,0.88,1.5,0.88);
  } else if(name==="lamp"){
    C(0,0,0.55); L(-1.4,0,-0.55,0); L(0.55,0,1.4,0); L(-0.39,-0.39,0.39,0.39); L(-0.39,0.39,0.39,-0.39);
  } else if(name==="sw"){
    L(-1.4,0,-0.5,0); L(0.5,0,1.4,0); C(-0.5,0,0.11,true); C(0.5,0,0.11,true); L(-0.5,0,0.42,-0.55);
  } else if(name==="node"){ C(0,0,0.14,true); }
  else if(name==="meter"){
    C(0,0,0.58); L(-1.4,0,-0.58,0); L(0.58,0,1.4,0);
    ctx.font="600 "+(u*0.5)+"px Inter, Arial"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.fillText(value||"V",0,0);
  } else if(name==="box"){
    ctx.beginPath(); ctx.rect(-1.5*u,-1*u,3*u,2*u); ctx.stroke();
    L(-2.2,-0.5,-1.5,-0.5); L(-2.2,0.5,-1.5,0.5); L(1.5,-0.5,2.2,-0.5); L(1.5,0.5,2.2,0.5);
  } else if(name==="cross"){ L(-0.3,-0.3,0.3,0.3); L(-0.3,0.3,0.3,-0.3); C(0,0,0.42); }
  if(label){
    ctx.font=(u*0.4)+"px Inter, Arial"; ctx.textAlign="center"; ctx.textBaseline="bottom";
    ctx.fillStyle=color||INK.ink;
    ctx.fillText(label,0,(name==="box"||name==="npn"||name==="opamp"?-1.2:-0.74)*u);
  }
  if(value&&name!=="meter"){
    ctx.font=(u*0.36)+"px Inter, Arial"; ctx.textAlign="center"; ctx.textBaseline="top";
    ctx.fillStyle=INK.dim;
    ctx.fillText(value,0,(name==="box"||name==="npn"||name==="opamp"?1.2:0.68)*u);
  }
  ctx.restore();
}

function buildScene2D(spec){
  var cfg=spec.scene2d||{};
  var view=cfg.view||[0,0,16,10];
  var shapes=cfg.shapes||[];
  var bg=cfg.background||"#070c16";
  var darkBg=(function(){
    var c=bg.replace("#",""); if(c.length===3) c=c[0]+c[0]+c[1]+c[1]+c[2]+c[2];
    var n=parseInt(c,16);
    return (((n>>16&255)*0.30+(n>>8&255)*0.59+(n&255)*0.11)/255)<0.5;
  })();
  labCanvas.style.display="block";
  renderer.domElement.style.display="none";
  stage.style.background=bg;
  if(cfg.caption){ elCaption.textContent=cfg.caption; elCaption.style.display="block";
                   elCaption.classList.toggle("light",!darkBg); }
  else elCaption.style.display="none";
  var ctx=labCtx;

  function draw(scope){
    var W=stage.clientWidth||1, H=stage.clientHeight||1;
    var dpr=Math.min(window.devicePixelRatio||1,2);
    labCanvas.width=Math.round(W*dpr); labCanvas.height=Math.round(H*dpr);
    labCanvas.style.width=W+"px"; labCanvas.style.height=H+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    var vw=view[2]-view[0], vh=view[3]-view[1];
    var s=Math.min(W/vw,H/vh)*0.93;
    var ox=(W-s*vw)/2, oy=(H-s*vh)/2;
    function PX(X){ return ox+(X-view[0])*s; }
    function PY(Y){ return H-oy-(Y-view[1])*s; }
    var baseInk = darkBg?INK.ink:"#1e293b";
    ctx.lineCap="round"; ctx.lineJoin="round";

    function drawShape(sh, scope){
      if(sh.when!==undefined && E(sh.when,scope,1)<0.5) return;
      var col=sh.color||sh.stroke||baseInk;
      var lw=Math.max(1,E(sh.lw,scope,0.055)*s);
      ctx.globalAlpha=E(sh.alpha,scope,1);
      ctx.strokeStyle=col; ctx.fillStyle=sh.fill||col; ctx.lineWidth=lw;
      if(sh.dash) ctx.setLineDash([lw*3,lw*2.2]); else ctx.setLineDash([]);
      var i;

      if(sh.k==="rect"){
        var w=E(sh.w,scope,1)*s, h=E(sh.h,scope,1)*s;
        var x=PX(E(sh.x,scope)), y=PY(E(sh.y,scope)+E(sh.h,scope,1));
        ctx.beginPath(); ctx.rect(x,y,w,h);
        if(sh.fill){ ctx.fillStyle=sh.fill; ctx.fill(); }
        if(sh.stroke){ ctx.strokeStyle=sh.stroke; ctx.stroke(); }
      }
      else if(sh.k==="circle"){
        ctx.beginPath(); ctx.arc(PX(E(sh.x,scope)),PY(E(sh.y,scope)),Math.max(0,E(sh.r,scope,0.3))*s,0,6.2832);
        if(sh.fill){ ctx.fillStyle=sh.fill; ctx.fill(); }
        if(sh.stroke||!sh.fill){ ctx.strokeStyle=sh.stroke||col; ctx.stroke(); }
      }
      else if(sh.k==="line"){
        ctx.beginPath(); ctx.moveTo(PX(E(sh.x1,scope)),PY(E(sh.y1,scope)));
        ctx.lineTo(PX(E(sh.x2,scope)),PY(E(sh.y2,scope))); ctx.stroke();
      }
      else if(sh.k==="arrow"){
        var ax=PX(E(sh.x1,scope)), ay=PY(E(sh.y1,scope)), bx=PX(E(sh.x2,scope)), by=PY(E(sh.y2,scope));
        var ang=Math.atan2(by-ay,bx-ax), hd=Math.max(lw*3.4,s*0.17);
        ctx.beginPath(); ctx.moveTo(ax,ay);
        ctx.lineTo(bx-Math.cos(ang)*hd*0.75,by-Math.sin(ang)*hd*0.75); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(bx,by);
        ctx.lineTo(bx-Math.cos(ang-0.42)*hd,by-Math.sin(ang-0.42)*hd);
        ctx.lineTo(bx-Math.cos(ang+0.42)*hd,by-Math.sin(ang+0.42)*hd);
        ctx.closePath(); ctx.fill();
      }
      else if(sh.k==="poly"){
        var pts=sh.pts||[];
        ctx.beginPath();
        for(i=0;i<pts.length;i++){
          var X=PX(E(pts[i][0],scope)), Y=PY(E(pts[i][1],scope));
          if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y);
        }
        if(sh.close) ctx.closePath();
        if(sh.fill){ ctx.fillStyle=sh.fill; ctx.fill(); }
        if(sh.stroke||!sh.fill){ ctx.strokeStyle=sh.stroke||col; ctx.stroke(); }
      }
      else if(sh.k==="arc"){
        ctx.beginPath();
        ctx.arc(PX(E(sh.x,scope)),PY(E(sh.y,scope)),Math.max(0,E(sh.r,scope,1))*s,
                -E(sh.a1,scope,1.57),-E(sh.a0,scope,0));
        ctx.stroke();
      }
      else if(sh.k==="text"){
        var size=E(sh.size,scope,0.42)*s;
        ctx.font=(sh.bold?"600 ":"")+size+"px Inter, Arial, sans-serif";
        ctx.textAlign=sh.align||"center"; ctx.textBaseline=sh.baseline||"middle";
        ctx.fillStyle=sh.color||baseInk;
        ctx.fillText(interp(sh.s||"",scope),PX(E(sh.x,scope)),PY(E(sh.y,scope)));
      }
      else if(sh.k==="sym"){
        drawSym(ctx,sh.n||"res",PX(E(sh.x,scope)),PY(E(sh.y,scope)),E(sh.s,scope,0.5)*s,
                E(sh.rot,scope,0),sh.color||INK.wire,
                sh.label?interp(sh.label,scope):null, sh.value?interp(sh.value,scope):null);
      }
      else if(sh.k==="plot"){
        var f=compile(sh.expr||"sin(u)");
        var u0=E(sh.u0,scope,0), u1=E(sh.u1,scope,6.2832);
        var bx0=E(sh.x,scope), by0=E(sh.y,scope), bw=E(sh.w,scope,6), bh=E(sh.h,scope,3);
        var ymin=E(sh.ymin,scope,-1), ymax=E(sh.ymax,scope,1);
        var N=Math.round(E(sh.samples,scope,240));
        if(sh.axis){
          ctx.save(); ctx.globalAlpha=0.4; ctx.strokeStyle=darkBg?"#4a6285":"#94a3b8"; ctx.lineWidth=1;
          ctx.beginPath(); ctx.rect(PX(bx0),PY(by0+bh),bw*s,bh*s); ctx.stroke();
          var zy=by0+bh*(0-ymin)/(ymax-ymin);
          if(zy>by0&&zy<by0+bh){ ctx.beginPath(); ctx.moveTo(PX(bx0),PY(zy)); ctx.lineTo(PX(bx0+bw),PY(zy)); ctx.stroke(); }
          ctx.restore();
        }
        ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.beginPath();
        for(i=0;i<N;i++){
          var uu=u0+(u1-u0)*i/(N-1); scope.u=uu;
          var yy=clamp(f(scope),ymin,ymax);
          var qx=PX(bx0+bw*i/(N-1)), qy=PY(by0+bh*(yy-ymin)/(ymax-ymin));
          if(i===0) ctx.moveTo(qx,qy); else ctx.lineTo(qx,qy);
        }
        ctx.stroke();
      }
      else if(sh.k==="strips"){
        var n=Math.round(clamp(E(sh.n,scope,12),1,80));
        var lo=E(sh.from,scope,0), hi=E(sh.to,scope,4);
        var fA=compile(sh.low||"0"), fB=compile(sh.high||"1");
        var vert=(sh.axis||"v")==="v", wd=(hi-lo)/n;
        ctx.globalAlpha=E(sh.alpha,scope,0.45);
        for(i=0;i<n;i++){
          var q=lo+wd*(i+0.5);
          scope.x=q; scope.y=q;
          var A=fA(scope), B=fB(scope);
          ctx.fillStyle=sh.fill||INK.accent;
          if(vert) ctx.fillRect(PX(q-wd*0.44),PY(B),wd*0.88*s,Math.abs(B-A)*s);
          else ctx.fillRect(PX(A),PY(q+wd*0.44),Math.abs(B-A)*s,wd*0.88*s);
          if(sh.stroke){ ctx.strokeStyle=sh.stroke; ctx.lineWidth=1;
            if(vert) ctx.strokeRect(PX(q-wd*0.44),PY(B),wd*0.88*s,Math.abs(B-A)*s);
            else ctx.strokeRect(PX(A),PY(q+wd*0.44),Math.abs(B-A)*s,wd*0.88*s); }
        }
        ctx.globalAlpha=1;
      }
      else if(sh.k==="dots"){
        var path=sh.path||[], nd=Math.round(E(sh.n,scope,8));
        if(path.length>1){
          var xs=[],ys=[],segs=[],total=0,z;
          for(z=0;z<path.length;z++){ xs.push(E(path[z][0],scope)); ys.push(E(path[z][1],scope)); }
          for(z=0;z<path.length-1;z++){ var d2=Math.hypot(xs[z+1]-xs[z],ys[z+1]-ys[z]); segs.push(d2); total+=d2; }
          if(total>0){
            var ph=E(sh.speed,scope,0.12)*scope.t;
            ctx.fillStyle=sh.fill||col;
            for(var dI=0;dI<nd;dI++){
              var fr=((dI/nd)+ph)%1; if(fr<0) fr+=1;
              var want=fr*total, acc=0, sg=0;
              while(sg<segs.length-1 && acc+segs[sg]<want){ acc+=segs[sg]; sg++; }
              var lf=segs[sg]?(want-acc)/segs[sg]:0;
              var dx=xs[sg]+(xs[sg+1]-xs[sg])*lf, dy=ys[sg]+(ys[sg+1]-ys[sg])*lf;
              ctx.beginPath(); ctx.arc(PX(dx),PY(dy),Math.max(1.5,E(sh.r,scope,0.11)*s),0,6.2832); ctx.fill();
            }
          }
        }
      }
      else if(sh.k==="repeat"){
        var rn=Math.round(clamp(E(sh.n,scope,3),1,120));
        var dx2=E(sh.dx,scope,1), dy2=E(sh.dy,scope,0);
        var ix=E(sh.x,scope,0), iy=E(sh.y,scope,0);
        var inner=sh.shape||{};
        for(i=0;i<rn;i++){
          var sub={}, key;
          for(key in inner) if(inner.hasOwnProperty(key)) sub[key]=inner[key];
          scope.i=i;
          sub.x = ix+dx2*i + E(inner.x,scope,0);
          sub.y = iy+dy2*i + E(inner.y,scope,0);
          drawShape(sub,scope);
        }
        scope.i=0;
      }
      ctx.globalAlpha=1; ctx.setLineDash([]);
    }

    for(var i2=0;i2<shapes.length;i2++) drawShape(shapes[i2],scope);
  }

  var reads=cfg.readouts||[];
  return { lab:true, update:function(t,scope){
    draw(scope);
    var out=[];
    for(var i=0;i<Math.min(reads.length,3);i++)
      out.push([reads[i].label, interp(reads[i].s||("{"+reads[i].expr+"}"),scope), reads[i].note||""]);
    return out;
  }};
}

      axis:"x",extent:14,lam:"a",background:"#05070c",apparatus:"slits",fieldStop:false,unit:"mm",unitStep:5,

{k:"air wedge thin film soap equal thickness fizeau parallel fringes flats",s:{

{k:"crystal lattice unit cell ionic sodium chloride nacl solid state packing",s:{
 title:"Ionic crystal lattice",subtitle:"No molecules here, just a repeating pattern",
 equation:"NaCl, face-centred cubic",type:"molecule",
 explain:"Each sodium is surrounded by six chlorides and the other way round, so there is no such thing as one NaCl molecule. Breaking this arrangement takes a lot of energy, which is why the melting point is so high.",
 controls:[{v:"a",label:"Rotation",min:0,max:1.5,step:0.05,value:0.3}],readouts:[],
 molecule:(function(){
   var atoms=[],bonds=[],idx={},n=0,i,j,k;
   for(i=0;i<3;i++)for(j=0;j<3;j++)for(k=0;k<3;k++){
     atoms.push({el:((i+j+k)%2===0)?"Na":"Cl",x:i-1,y:j-1,z:k-1}); idx[i+","+j+","+k]=n++;
   }
   for(i=0;i<3;i++)for(j=0;j<3;j++)for(k=0;k<3;k++){
     if(i<2) bonds.push([idx[i+","+j+","+k], idx[(i+1)+","+j+","+k]]);
     if(j<2) bonds.push([idx[i+","+j+","+k], idx[i+","+(j+1)+","+k]]);
     if(k<2) bonds.push([idx[i+","+j+","+k], idx[i+","+j+","+(k+1)]]);
   }
   return {formula:"NaCl",geometry:"Rock salt",scale:2.4,labels:false,atomScale:0.9,atoms:atoms,bonds:bonds};
 })()}},

{k:"diode characteristics shockley curve knee breakdown current voltage",s:{
 title:"Diode V-I characteristic",subtitle:"The knee, and the wall in reverse",
 equation:"I = I\u209b(e^(V/\u03b7V\u209c) \u2212 1)",type:"curve",

 curve:{range:[-4,1.4],items:[{expr:"min(3.5, 0.00002*(exp((x-a+0.25)/(b*0.026))-1))",color:"#38bdf8",label:"I"}]}}},

{k:"optical fibre fiber step index graded numerical aperture acceptance core cladding",s:{
 title:"Step-index and graded-index fibre",subtitle:"Two ways to keep the ray inside",
 equation:"NA = \u221a(n\u2081\u00b2 \u2212 n\u2082\u00b2)",type:"scene2d",
 explain:"A step-index fibre bounces the ray off a sharp boundary, so rays taking different paths arrive at different times and the pulse smears. A graded index bends the ray smoothly and the off-axis rays travel faster in the lower-index outer glass, which largely cancels that spread.",
 controls:[{v:"a",label:"Index profile",min:0,max:1,step:1,value:0},
           {v:"b",label:"Ray angle",min:0.4,max:2.2,step:0.05,value:1.1},
           {v:"c",label:"Core index n\u2081",min:1.45,max:1.6,step:0.005,value:1.5}],
 readouts:[{label:"Numerical aperture",s:"{sqrt(c*c - 1.44)}",note:"with n\u2082 = 1.2"},
           {label:"Acceptance angle",s:"{asin(min(sqrt(c*c-1.44),1))*57.3}\u00b0",note:"half-angle of the cone"}],
 scene2d:{view:[0,0,16,10],background:"#070c16",
  caption:"Slider 0 is step-index, 1 is graded-index.",
  shapes:[
   {k:"rect",x:1,y:1.6,w:14,h:6.8,fill:"#101b2e",stroke:"#4a6285",lw:0.04},
   {k:"rect",x:1,y:3.1,w:14,h:3.8,fill:"#16304f",stroke:"#38bdf8",lw:0.04},
   {k:"text",x:2.4,y:7.8,s:"cladding n\u2082",color:"#7f94b4",size:0.4},
   {k:"text",x:2.3,y:5,s:"core n\u2081 = {c}",color:"#7dd3fc",size:0.4},
   {k:"plot",when:"1-a",expr:"5+1.75*asin(sin(b*u))*0.6366",u0:0,u1:14,
    x:1,y:1.6,w:14,h:6.8,ymin:1.6,ymax:8.4,color:"#fbbf24",lw:0.07,samples:400},
   {k:"plot",when:"a",expr:"5+1.7*sin(b*u)",u0:0,u1:14,
    x:1,y:1.6,w:14,h:6.8,ymin:1.6,ymax:8.4,color:"#fbbf24",lw:0.07,samples:400},
   {k:"text",when:"1-a",x:8,y:9.3,s:"step index - sharp reflections, modal dispersion",color:"#fbbf24",size:0.44},
   {k:"text",when:"a",x:8,y:9.3,s:"graded index - smooth refocusing, less spreading",color:"#fbbf24",size:0.44},
   {k:"arrow",x1:0.2,y1:5,x2:1.1,y2:5,color:"#f43f5e",lw:0.05},

  ]}}},

{k:"phasor phasors ac circuits circuit impedance powerfactor power lagging leading alternating reactance",s:{
 title:"AC phasors and power factor",subtitle:"Voltage and current, out of step",
 equation:"Z = \u221a(R\u00b2 + X\u00b2),  \u03c6 = tan\u207b\u00b9(X/R)",type:"scene2d",
 explain:"Both quantities rotate at the same speed, so the angle between them stays fixed; that angle is the phase difference. Only the component of current in line with the voltage does real work, which is exactly what the power factor measures.",
 controls:[{v:"a",label:"Resistance R (\u03a9)",min:1,max:20,step:0.5,value:8},
           {v:"b",label:"Reactance X (\u03a9)",min:-20,max:20,step:0.5,value:6}],
 readouts:[{label:"Impedance |Z|",s:"{sqrt(a*a+b*b)} \u03a9",note:"R and X combined"},
           {label:"Phase angle",s:"{atan2(b,a)*57.3}\u00b0",note:"positive means current lags"},
           {label:"Power factor",s:"{cos(atan2(b,a))}",note:"cos \u03c6"}],
 scene2d:{view:[0,0,17,10],background:"#070c16",
  caption:"Left: rotating phasors. Right: the same thing as waveforms.",
  shapes:[
   {k:"circle",x:4.2,y:5,r:3.1,stroke:"#25374f",lw:0.03},
   {k:"line",x1:1,y1:5,x2:7.5,y2:5,color:"#25374f",lw:0.03},
   {k:"line",x1:4.2,y1:1.8,x2:4.2,y2:8.2,color:"#25374f",lw:0.03},
   {k:"arrow",x1:4.2,y1:5,x2:"4.2+3*cos(t)",y2:"5+3*sin(t)",color:"#38bdf8",lw:0.07},
   {k:"arrow",x1:4.2,y1:5,x2:"4.2+2.2*cos(t-atan2(b,a))",y2:"5+2.2*sin(t-atan2(b,a))",color:"#fbbf24",lw:0.07},
   {k:"text",x:"4.2+3.5*cos(t)",y:"5+3.5*sin(t)",s:"V",color:"#38bdf8",size:0.5,bold:true},
   {k:"text",x:"4.2+2.7*cos(t-atan2(b,a))",y:"5+2.7*sin(t-atan2(b,a))",s:"I",color:"#fbbf24",size:0.5,bold:true},
   {k:"text",x:4.2,y:1.2,s:"\u03c6 = {atan2(b,a)*57.3}\u00b0",color:"#a78bfa",size:0.46},
   {k:"plot",expr:"sin(u-t)",u0:0,u1:18.8,x:8.6,y:3,w:7.8,h:4,ymin:-1.15,ymax:1.15,
    color:"#38bdf8",lw:0.07,axis:true},
   {k:"plot",expr:"0.73*sin(u-t-atan2(b,a))",u0:0,u1:18.8,x:8.6,y:3,w:7.8,h:4,ymin:-1.15,ymax:1.15,
    color:"#fbbf24",lw:0.07},
   {k:"text",x:12.5,y:7.6,s:"same frequency, fixed phase gap",color:"#7f94b4",size:0.4}
  ]}}},

{k:"transformer single phase winding turns ratio core primary secondary emf mutual",s:{
 title:"Single-phase transformer",subtitle:"Turns ratio sets everything",
 equation:"V\u2082/V\u2081 = N\u2082/N\u2081 = I\u2081/I\u2082",type:"scene2d",

{k:"halfwave rectifier half diode rectification pulsating ripple singlediode",s:{

{k:"fullwave bridge rectifier fourdiode centre tap smoothing",s:{
 title:"Full-wave bridge rectifier",subtitle:"Four diodes, both halves used",
 equation:"V\u2091\u1d63 = 2V\u2098/\u03c0,  ripple factor 0.48",type:"scene2d",
 explain:"Two diodes conduct on each half cycle and always push current through the load the same way, so the negative half is flipped up rather than thrown away. Twice the DC output and far less ripple than half-wave, with no centre-tapped transformer needed.",
 controls:[{v:"a",label:"Peak input (V)",min:5,max:50,step:1,value:24}],
 readouts:[{label:"DC output",s:"{2*a/pi} V",note:"2V\u2098/\u03c0"},
           {label:"RMS output",s:"{a/1.414} V",note:"V\u2098/\u221a2"},
           {label:"Ripple factor",s:"0.48",note:"much cleaner"}],
 scene2d:{view:[0,0,17,10],background:"#070c16",
  caption:"Diodes conduct in diagonal pairs, alternating each half cycle.",
  shapes:[
   {k:"sym",n:"vac",x:1.6,y:5,s:0.5,rot:90,color:"#38bdf8",label:"{a} V"},

{k:"green stokes gauss divergence theorem line integral surface boundary circulation",s:{

 equation:"\u222e F\u00b7dr = \u222c (\u2207\u00d7F)\u00b7dA",type:"scene2d",

  caption:"Every internal arrow has a partner pointing the other way.",

{k:"crystal field splitting octahedral tetrahedral d orbital ligand cfse coordination complex",s:{
 title:"Crystal field splitting",subtitle:"Ligands lift the d-orbital degeneracy",

{k:"thevenin norton theorem equivalent circuit source transformation open short",s:{
 title:"Thevenin and Norton equivalents",subtitle:"Any linear network is just a source and a resistor",
 equation:"V\u209c\u2095 = I\u2099R\u2099,  R\u209c\u2095 = R\u2099",type:"scene2d",
 explain:"Whatever is inside the box, the load cannot tell the difference between the real network and a single source with one series resistance. The Norton form is the same fact written as a current source in parallel, and either one converts to the other by Ohm's law.",
 controls:[{v:"a",label:"Open-circuit voltage (V)",min:1,max:40,step:0.5,value:12},
           {v:"b",label:"Equivalent resistance (\u03a9)",min:0.5,max:20,step:0.5,value:4},
           {v:"c",label:"Load resistance (\u03a9)",min:0.5,max:30,step:0.5,value:6}],
 readouts:[{label:"Norton current",s:"{a/b} A",note:"I\u2099 = V\u209c\u2095/R\u209c\u2095"},

{k:"resonance resonant series parallel quality qfactor factor bandwidth halfpower half cutoff frequencies tuned rlc",s:{
 title:"Series resonance and Q factor",subtitle:"Bandwidth is what quality really means",
 equation:"f\u2080 = 1/(2\u03c0\u221a(LC)),  Q = f\u2080/(f\u2082\u2212f\u2081)",type:"curve",
 explain:"At resonance the inductive and capacitive reactances cancel, impedance collapses to the resistance alone and current peaks. The half-power points sit where current falls to about seventy percent of the peak, and a narrower gap between them means a higher Q and a sharper tuning.",
 controls:[{v:"a",label:"Resonant frequency f\u2080",min:1,max:6,step:0.05,value:3},
           {v:"b",label:"Quality factor Q",min:1,max:30,step:0.5,value:8}],
 readouts:[{label:"Bandwidth",expr:"a/b"},
           {label:"Lower cutoff f\u2081",expr:"a - a/(2*b)"},
           {label:"Upper cutoff f\u2082",expr:"a + a/(2*b)"}],
 curve:{range:[0.2,8],items:[
  {expr:"3/sqrt(1 + b*b*(x/a - a/x)^2)",color:"#38bdf8",label:"I"},
  {expr:"3/1.414",color:"#f43f5e",thin:true,label:"half power"}]}}},

{k:"transient rlc time constant tau charging discharging inductor capacitor natural response",s:{
 title:"RL and RC transients",subtitle:"Everything happens in about five time constants",
 equation:"i\u2097 = I(1\u2212e^(\u2212t/\u03c4)),  v\u1d04 = V(1\u2212e^(\u2212t/\u03c4))",type:"curve",
 explain:"An inductor resists a sudden change in current and a capacitor resists a sudden change in voltage, so both approach their final value along the same exponential shape. One time constant gets you sixty-three percent of the way there and five gets you close enough to call it settled.",
 controls:[{v:"a",label:"Time constant \u03c4",min:0.2,max:3,step:0.05,value:1},
           {v:"b",label:"Final value",min:1,max:5,step:0.1,value:4}],
 readouts:[{label:"At one \u03c4",expr:"b*0.632"},
           {label:"Settling time (5\u03c4)",expr:"5*a"},
           {label:"At 3\u03c4",expr:"b*0.95"}],
 curve:{range:[0,12],items:[
  {expr:"b*(1-exp(-x/a))",color:"#38bdf8",label:"charging"},
  {expr:"b*exp(-x/a)",color:"#f43f5e",label:"discharging"},
  {expr:"b",color:"#3f3f46",thin:true}]}}},

function editDistance(a,b,cap){
  if(a===b) return 0;
  if(Math.abs(a.length-b.length)>cap) return cap+1;
  var prev=new Array(b.length+1), cur=new Array(b.length+1), i, j;
  for(j=0;j<=b.length;j++) prev[j]=j;
  for(i=1;i<=a.length;i++){
    cur[0]=i; var rowMin=i;
    for(j=1;j<=b.length;j++){
      var cost=a.charCodeAt(i-1)===b.charCodeAt(j-1)?0:1;
      cur[j]=Math.min(cur[j-1]+1, prev[j]+1, prev[j-1]+cost);
      if(cur[j]<rowMin) rowMin=cur[j];
    }
    if(rowMin>cap) return cap+1;
    var tmp=prev; prev=cur; cur=tmp;
  }
  return prev[b.length];
}

function pickFromLibrary(text){
  var q=text.toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
  var words=q.split(" ").filter(function(w){return w.length>2;});
  var best=null,bestScore=0;
  for(var i=0;i<LIB.length;i++){
    var keys=LIB[i].k.split(" "), score=0;
    for(var j=0;j<words.length;j++){
      var w=words[j], hit=0;
      if(keys.indexOf(w)>=0) hit=3;
      else {
        for(var m=0;m<keys.length;m++){
          var kw=keys[m];
          if(w.length>4&&(kw.indexOf(w)===0||w.indexOf(kw)===0)&&Math.min(w.length,kw.length)>=5){
            if(hit<2.1) hit=2.1;
            continue;
          }
          if(w.length>=5&&Math.abs(w.length-kw.length)<=3){
            var cap=w.length>=8?2:1;
            var dist=editDistance(w,kw,cap);
            if(dist<=cap){                              // typo tolerance, closer wins
              var val=2.9-0.45*dist;
              if(val>hit) hit=val;
            }
          }
        }
      }
      score+=hit;
    }
    if(score>bestScore){bestScore=score;best=LIB[i].s;}
  }
  return bestScore>=2?best:null;
}
function looksLikeMath(t){
  return /[+\-*/^=]/.test(t)&&/[a-z]/i.test(t)&&!/\s(and|the|what|how|why|explain|about)\s/i.test(" "+t+" ");
}
function autoControls(body){
  var out=[],names=["a","b","c","d"];
  for(var i=0;i<names.length;i++)
    if(new RegExp("\\b"+names[i]+"\\b").test(body))
      out.push({v:names[i],label:"Constant "+names[i],min:-3,max:3,step:0.05,value:1});
  return out;
}
function specFromEquation(text){
  var body=tidy(text), hasY=/\by\b/.test(body), hasX=/\bx\b/.test(body);
  if(hasX&&hasY) return {title:"Your surface",subtitle:"z = "+body,equation:"z = "+body,type:"surface",
    explain:"Plotted directly from what you typed. Colour follows height. Use a, b, c, d as adjustable constants and t for time.",
    controls:autoControls(body),readouts:[],surface:{expr:body,xrange:[-6,6],yrange:[-6,6],res:66}};
  return {title:"Your curve",subtitle:"y = "+body,equation:"y = "+body,type:"curve",
    explain:"Plotted directly from what you typed. Use a, b, c, d as adjustable constants and t for time, for example a*sin(b*x - t).",
    controls:autoControls(body),readouts:[],curve:{range:[-9,9],items:[{expr:body,color:"#38bdf8",label:"y"}]}};
}

var current=null, currentSpec=null, vars={}, paused=false, tNow=0;
var elTitle=document.getElementById("title"), elSub=document.getElementById("sub"),
    elEq=document.getElementById("eq"), elExp=document.getElementById("explain"),
    elCtl=document.getElementById("controls"), elRead=document.getElementById("readouts"),
    elStatus=document.getElementById("status");

function say(m){ if(!m){elStatus.style.display="none";return;} elStatus.textContent=m; elStatus.style.display="block"; }
function fmt(v){
  if(!isFinite(v)) return "\u2014";
  if(Math.abs(v)>=1e5||(Math.abs(v)<1e-3&&v!==0)) return v.toExponential(2);
  return (Math.round(v*1000)/1000).toString();
}

var readCells=[], fps=0, msPer=0;
function load(spec){
  if(!spec||!BUILDERS[spec.type]){ say("That scene description could not be rendered. Try wording it differently."); return; }
  clearWorld();
  currentSpec=spec; vars={}; tNow=0;
  elTitle.textContent=spec.title||"Untitled";
  elSub.textContent=spec.subtitle||"";
  elEq.textContent=spec.equation||"";
  elEq.style.display=spec.equation?"block":"none";
  elExp.textContent=spec.explain||"";
  elCtl.innerHTML="";
  var ctrls=spec.controls||[];
  for(var i=0;i<Math.min(ctrls.length,4);i++)(function(c){
    vars[c.v]=c.value;
    var wrap=document.createElement("div"); wrap.className="field";
    var top=document.createElement("div"); top.className="ftop";
    var nm=document.createElement("b"); nm.textContent=c.label||c.v;
    var val=document.createElement("span"); val.textContent=fmt(c.value);
    top.appendChild(nm); top.appendChild(val);
    var sl=document.createElement("input");
    sl.type="range"; sl.min=c.min; sl.max=c.max; sl.step=c.step; sl.value=c.value;
    sl.addEventListener("input",function(){ vars[c.v]=parseFloat(sl.value); val.textContent=fmt(vars[c.v]); });
    wrap.appendChild(top); wrap.appendChild(sl); elCtl.appendChild(wrap);
  })(ctrls[i]);
  elCtl.style.display=ctrls.length?"flex":"none";

  var flat2d=(spec.type==="lab"||spec.type==="scene2d");
  var fxEl=document.getElementById("fx"); if(fxEl) fxEl.style.opacity=flat2d?"0":"1";
  if(!flat2d){
    labCanvas.style.display="none";
    elCaption.style.display="none";
    renderer.domElement.style.display="block";
    stage.style.background="";
  }
  var flat = (spec.type==="graph"||spec.type==="molecule"||spec.type==="transform");
  ground.visible = !flat;
  buildAxes(spec.type==="curve"||spec.type==="surface"||spec.type==="parametric"||spec.type==="field"||spec.type==="transform",
            spec.type==="transform"? -0.02 : -8);
  current=BUILDERS[spec.type](spec);
  cam.tth=HOME.th; cam.tph=spec.type==="transform"?0.55:HOME.ph;
  cam.tr = spec.type==="molecule"?15:(spec.type==="surface"?22:HOME.r);
  readCells=[]; elRead.innerHTML="";
  stage.classList.remove("dim");
  say(null);
}

function paintReadouts(extra){
  var list=[], rs=(currentSpec&&currentSpec.readouts)||[];
  for(var i=0;i<Math.min(rs.length,4);i++) list.push([fmt(compile(rs[i].expr)(vars)), rs[i].label]);
  for(var j=0;j<extra.length&&list.length<6;j++) list.push([extra[j][1], extra[j][0]+" \u00b7 "+extra[j][2]]);
  list.push([fps?fps.toFixed(0):"\u2014","Frames per second",true]);
  list.push([msPer?msPer.toFixed(1)+" ms":"\u2014","Frame time",true]);
  if(readCells.length!==list.length){
    elRead.innerHTML=""; readCells=[];
    for(var k=0;k<list.length;k++){
      var d=document.createElement("div"); d.className="cell"+(list[k][2]?" perf":"");
      d.innerHTML='<div class="v"></div><div class="k"></div>';
      elRead.appendChild(d); readCells.push(d);
    }
  }
  for(var m=0;m<list.length;m++){
    readCells[m].querySelector(".v").textContent=list[m][0];
    readCells[m].querySelector(".k").textContent=list[m][1];
  }
}

function visualize(text){
  var topic=(text||"").trim();
  if(!topic) return;
  var found=pickFromLibrary(topic)||(looksLikeMath(topic)?specFromEquation(topic):null);
  if(found){ load(found); return; }
  stage.classList.add("dim");
  say("No topic matches \u201c"+topic+"\u201d. Check the spelling, try a shorter word, or type an equation such as z = sin(x)*cos(y).");
}

function resize(){
  var w=stage.clientWidth||1, h=stage.clientHeight||1;
  camera.aspect=w/h; camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
}

var last=performance.now(), frames=0, acc=0, readClock=0, brandClock=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min((now-last)/1000,0.05); last=now;
  frames++; acc+=dt; readClock+=dt;
  if(acc>=0.5){ fps=frames/acc; msPer=acc*1000/frames; frames=0; acc=0; }
  if(!paused) tNow+=dt;
  var extra=[];
  if(current){ vars.t=tNow; extra=current.update(tNow,vars)||[]; }
  if(readClock>=0.2){ paintReadouts(extra); readClock=0; }
  brandClock+=dt; if(brandClock>=0.6){ brandClock=0; rcCheck(); }
  if(!(current&&current.lab)){ tickCamera(); renderer.render(scene,camera); }
}

resize();
load(LIB[13].s);                    // opens on the electromagnetic wave
requestAnimationFrame(frame);
})();
</script>

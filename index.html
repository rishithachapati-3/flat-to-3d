<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fibonacci Realm</title>
<style>
  * { touch-action: manipulation; box-sizing: border-box; }
  body { margin: 0; overflow: hidden; background: #020208; font-family: 'Segoe UI', sans-serif; user-select: none; }

  #avatar-modal {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 100; background: rgba(10, 10, 25, 0.95); padding: 28px;
    border-radius: 16px; border: 1px solid #00e5ff; width: 300px; color: white;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.3); text-align: center;
  }
  input, select, button {
    width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2); background: #12122b; color: white;
    box-sizing: border-box; outline: none; font-size: 14px;
  }
  button { background: linear-gradient(45deg, #00e5ff, #7600ff); font-weight: bold; cursor: pointer; border: none; margin-top: 16px; }
  button:hover { opacity: 0.9; }
  label { font-size: 12px; color: #aaa; display: block; margin-top: 10px; text-align: left; }

  #hud {
    display: none; position: absolute; top: 15px; left: 15px; z-index: 10;
    color: #00e5ff; background: rgba(0, 0, 0, 0.75); padding: 10px 16px;
    border-radius: 8px; border: 1px solid #00e5ff; font-size: 12px; line-height: 1.5; max-width: 240px;
  }
  #toast {
    display: none; position: absolute; top: 18%; left: 50%; transform: translate(-50%, -50%);
    z-index: 30; color: #ffe082; background: rgba(20, 12, 0, 0.85); padding: 14px 26px;
    border-radius: 12px; border: 1px solid #ffc24b; font-size: 15px; font-weight: bold;
    text-align: center; box-shadow: 0 0 20px rgba(255, 194, 75, 0.5); pointer-events: none;
    transition: opacity 0.4s ease;
  }

  #resource-strip {
    display: none; position: absolute; top: 15px; right: 15px; z-index: 10;
    background: rgba(0, 0, 0, 0.75); border: 1px solid #ffc24b; border-radius: 20px;
    padding: 8px 14px; gap: 12px; align-items: center; cursor: pointer;
    min-height: 40px; min-width: 40px;
  }
  #resource-strip.show { display: flex; }
  .resource-chip { display: flex; align-items: center; gap: 5px; color: #ffe082; font-size: 13px; font-weight: bold; }
  .resource-icon { width: 16px; height: 16px; border-radius: 3px; flex-shrink: 0; }

  #inventory-panel {
    display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 40; background: rgba(10, 10, 25, 0.97); border: 1px solid #ffc24b;
    border-radius: 16px; padding: 22px; width: min(320px, 85vw); color: white;
    box-shadow: 0 0 30px rgba(255, 194, 75, 0.3);
  }
  #inventory-panel.show { display: block; }
  #inventory-panel h3 { margin: 0 0 14px 0; color: #ffc24b; font-size: 16px; }
  #inventory-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .inv-slot {
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 194, 75, 0.3);
    border-radius: 10px; padding: 12px 6px; text-align: center; font-size: 11px;
  }
  .inv-slot-icon { width: 28px; height: 28px; border-radius: 6px; margin: 0 auto 6px auto; }
  .inv-slot-count { font-weight: bold; color: #ffe082; font-size: 14px; }
  #inventory-close {
    margin-top: 16px; width: 100%; padding: 10px; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; color: white; font-size: 13px;
  }
  #crosshair {
    display: none; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); z-index: 10; pointer-events: none;
    width: 22px; height: 22px;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #00e5ff;
    box-shadow: 0 0 6px #00e5ff; border-radius: 1px;
  }
  #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; transform: translateY(-50%); }
  #crosshair-dot {
    position: absolute; top: 50%; left: 50%; width: 4px; height: 4px;
    background: #ffffff; border-radius: 50%; transform: translate(-50%, -50%);
    box-shadow: 0 0 4px #fff;
  }

  #hotbar-wrap {
    display: none; position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 20; flex-direction: column; align-items: center; gap: 8px;
  }
  #hotbar-wrap.show { display: flex; }
  #hotbar { display: flex; gap: 8px; background: rgba(0,0,0,0.6); padding: 8px; border-radius: 10px; }
  .hotbar-slot {
    width: 46px; height: 46px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.25);
    display: flex; align-items: center; justify-content: center; color: white; font-size: 11px; font-weight: bold;
    cursor: pointer;
  }
  .hotbar-slot.active { border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.6); }
  #shape-toggle {
    background: rgba(0,0,0,0.6); color: #fff; border: 1px solid rgba(255,255,255,0.3);
    padding: 6px 14px; border-radius: 8px; font-size: 11px; cursor: pointer; width: auto; margin: 0;
  }

  .touch-btn {
    position: absolute; z-index: 50; display: none;
    width: 60px; height: 60px; border-radius: 50%; color: white;
    font-weight: bold; font-size: 12px; border: 2px solid #00e5ff;
    background: rgba(0, 229, 255, 0.25); backdrop-filter: blur(4px);
    align-items: center; justify-content: center;
  }
  #btn-forward { left: 80px; bottom: 130px; }
  #btn-backward { left: 80px; bottom: 50px; }
  #btn-left { left: 20px; bottom: 90px; }
  #btn-right { left: 140px; bottom: 90px; }
  #btn-mine { right: 90px; bottom: 60px; border-color: #ff0055; background: rgba(255, 0, 85, 0.4); }
  #btn-build { right: 20px; bottom: 120px; border-color: #00ffaa; background: rgba(0, 255, 170, 0.4); }
  #btn-jump { left: 80px; bottom: 190px; width: 50px; height: 50px; border-color: #ffee00; background: rgba(255, 238, 0, 0.3); font-size: 10px; }
  #btn-sprint {
    left: 20px; bottom: 20px; width: 44px; height: 44px; border-color: #ff8800;
    background: rgba(255, 136, 0, 0.25); font-size: 9px;
  }
  #btn-sprint.active { background: rgba(255, 136, 0, 0.7); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="avatar-modal">
  <h2 style="color:#00e5ff; margin:0;">FIBONACCI REALM</h2>
  <label>Player Name</label>
  <input type="text" id="playerName" value="Architect Zero">
  <label>Avatar Archetype</label>
  <select id="avatarArchetype">
    <option value="bronze">India - Deep Bronze</option>
    <option value="neon">Japan - Neon Fair</option>
    <option value="obsidian">Africa - Royal Obsidian</option>
    <option value="golden">Western - Golden Fair</option>
  </select>
  <button onclick="enterWorld()">ENTER WORLD</button>
</div>

<div id="hud">
  Architect: <span id="hudName"></span><br>
  <span id="wsStatus" style="color:#00ffaa;">Connecting...</span><br>
  <span style="font-size:11px; color:#aaa;">Desktop: L-Click Mine · R-Click Build · 1-4 material · V shape</span>
</div>
<div id="toast"></div>
<div id="resource-strip" onclick="toggleInventoryPanel()"></div>
<div id="inventory-panel">
  <h3>Inventory</h3>
  <div id="inventory-grid"></div>
  <button id="inventory-close" onclick="toggleInventoryPanel()">Close</button>
</div>
<div id="crosshair"><div id="crosshair-dot"></div></div>
<div id="hotbar-wrap">
  <button id="shape-toggle" onclick="toggleShape()">Shape: Cube</button>
  <div id="hotbar"></div>
</div>

<div id="btn-forward" class="touch-btn">▲</div>
<div id="btn-backward" class="touch-btn">▼</div>
<div id="btn-left" class="touch-btn">◄</div>
<div id="btn-right" class="touch-btn">►</div>
<div id="btn-mine" class="touch-btn">MINE</div>
<div id="btn-build" class="touch-btn">BUILD</div>
<div id="btn-jump" class="touch-btn">JUMP</div>
<div id="btn-sprint" class="touch-btn">SPRINT</div>

<script>
const BACKEND = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
  ? 'http://127.0.0.1:8000'
  : `http://${window.location.hostname}:8000`;
const WS_BACKEND = BACKEND.replace('http', 'ws');

// density values mirror the backend's BLOCK_TYPES densities -- used here only
// for cosmetic touches (camera shake strength, particle punch), never for
// the actual physics decision, which always comes from the server.
const BLOCK_TYPES = {
  crystal_cyan:   { color: 0x00e5ff, label: "Cyan Crystal", density: 1.0 },
  crystal_violet: { color: 0x7600ff, label: "Violet Crystal", density: 1.3 },
  obsidian:       { color: 0x1a1a2e, label: "Obsidian", density: 1.8 },
  gold:           { color: 0xffc24b, label: "Gold", density: 0.7 },
  crystal_bloom:  { color: 0xff9de6, label: "Crystal Bloom", density: 0.6 },
};
const BLOCK_ORDER = ['crystal_cyan', 'crystal_violet', 'obsidian', 'gold']; // default hotbar
let unlockedBlockTypes = [...BLOCK_ORDER]; // crystal_bloom is added once a chest is found
let selectedBlockType = BLOCK_ORDER[0];

const SHAPE_ORDER = ['cube', 'slab'];
let selectedShape = SHAPE_ORDER[0];

function toggleShape() {
  const idx = (SHAPE_ORDER.indexOf(selectedShape) + 1) % SHAPE_ORDER.length;
  selectedShape = SHAPE_ORDER[idx];
  document.getElementById('shape-toggle').innerText =
    `Shape: ${selectedShape === 'cube' ? 'Cube' : 'Slab'}`;
}

// ============================================================
// Small shared helpers: color lerp, easing, canvas textures
// ============================================================

function lerpHexColor(hexA, hexB, t) {
  const a = new THREE.Color(hexA), b = new THREE.Color(hexB);
  return a.lerp(b, t);
}
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeInQuad(t) { return t * t; }

// Soft radial-gradient sprite texture, reused for glows / clouds / shadow blobs.
function makeRadialTexture(centerAlpha, edgeAlpha, size) {
  size = size || 128;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, `rgba(255,255,255,${centerAlpha})`);
  grad.addColorStop(1, `rgba(255,255,255,${edgeAlpha})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, size, size);
  return new THREE.CanvasTexture(c);
}

const GLOW_TEXTURE = makeRadialTexture(0.85, 0);
const SHADOW_BLOB_TEXTURE = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(0,0,0,0.55)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();
const CLOUD_TEXTURE = makeRadialTexture(0.5, 0, 256);

// ============================================================
// Scene setup
// ============================================================
const scene = new THREE.Scene();

function makeSkyTexture(topColor, midColor, horizonColor) {
  const c = document.createElement('canvas');
  c.width = 2; c.height = 256;
  const ctx = c.getContext('2d');
  const grad = ctx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0, '#' + topColor.getHexString());
  grad.addColorStop(0.55, '#' + midColor.getHexString());
  grad.addColorStop(1, '#' + horizonColor.getHexString());
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 2, 256);
  return new THREE.CanvasTexture(c);
}

// Day/night cycle keyframes: [top, mid, horizon] sky colors + sun color/intensity.
const DAY_KEYFRAMES = [
  { t: 0.00, top: 0x05021a, mid: 0x0b0730, horizon: 0x1a1040, sun: 0x8899ff, sunI: 0.4, ambI: 0.25 }, // midnight
  { t: 0.25, top: 0x2b0f4d, mid: 0x7a3b6e, horizon: 0xff9d6c, sun: 0xffb37a, sunI: 1.1, ambI: 0.35 }, // sunrise
  { t: 0.50, top: 0x1e5799, mid: 0x3a8bc2, horizon: 0x8fd1e8, sun: 0xfff6e0, sunI: 1.2, ambI: 0.4 }, // noon
  { t: 0.75, top: 0x2b0f4d, mid: 0x7a2f6a, horizon: 0xff7a59, sun: 0xff9a5c, sunI: 1.1, ambI: 0.35 }, // sunset
  { t: 1.00, top: 0x05021a, mid: 0x0b0730, horizon: 0x1a1040, sun: 0x8899ff, sunI: 0.4, ambI: 0.25 }, // midnight (wrap)
];
function sampleDayCycle(t) {
  for (let i = 0; i < DAY_KEYFRAMES.length - 1; i++) {
    const a = DAY_KEYFRAMES[i], b = DAY_KEYFRAMES[i + 1];
    if (t >= a.t && t <= b.t) {
      const localT = (t - a.t) / (b.t - a.t);
      return {
        top: lerpHexColor(a.top, b.top, localT),
        mid: lerpHexColor(a.mid, b.mid, localT),
        horizon: lerpHexColor(a.horizon, b.horizon, localT),
        sun: lerpHexColor(a.sun, b.sun, localT),
        sunI: a.sunI + (b.sunI - a.sunI) * localT,
        ambI: a.ambI + (b.ambI - a.ambI) * localT,
      };
    }
  }
  return sampleDayCycle(0); // fallback
}

const DAY_CYCLE_SECONDS = 600; // one full day/night loop (10 minutes -- much slower, as requested)
let dayTime = 0.32; // start mid-morning so the scene looks good immediately

const ambientLight = new THREE.AmbientLight(0xfff2e0, 0.6);
scene.add(ambientLight);

// Directional "sun" -- gives clean, sweeping shadows as it arcs across the sky.
const sunLight = new THREE.DirectionalLight(0xffffff, 2.2);
sunLight.castShadow = true;
sunLight.shadow.mapSize.set(1536, 1536);
sunLight.shadow.camera.left = -45;
sunLight.shadow.camera.right = 45;
sunLight.shadow.camera.top = 45;
sunLight.shadow.camera.bottom = -45;
sunLight.shadow.camera.near = 1;
sunLight.shadow.camera.far = 150;
sunLight.shadow.bias = -0.0015;
scene.add(sunLight);
scene.add(sunLight.target);

const rimLight = new THREE.PointLight(0xff0077, 1.1, 100);
rimLight.position.set(-15, 10, -15);
scene.add(rimLight);

let skyTexture = null;
let sceneTimeAccum = 0;
function updateDayCycle(delta) {
  dayTime = (dayTime + delta / DAY_CYCLE_SECONDS) % 1;
  const s = sampleDayCycle(dayTime);

  sceneTimeAccum += delta;
  if (sceneTimeAccum > 0.25) { // throttle expensive canvas regen
    sceneTimeAccum = 0;
    if (skyTexture) skyTexture.dispose();
    skyTexture = makeSkyTexture(s.top, s.mid, s.horizon);
    scene.background = skyTexture;
    scene.fog.color.copy(s.horizon);
  }

  const angle = dayTime * Math.PI * 2 - Math.PI / 2;
  const sunDist = 55;
  sunLight.position.set(Math.cos(angle) * sunDist, Math.max(Math.sin(angle) * sunDist, 4), 20);
  sunLight.target.position.set(0, 0, 0);
  sunLight.color.copy(s.sun);
  sunLight.intensity = s.sunI;
  ambientLight.color.copy(s.sun);
  ambientLight.intensity = s.ambI;
}

// Fallback flat ground, pushed well below the real terrain -- just catches
// the eye if the player somehow ends up outside the generated terrain grid.
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshStandardMaterial({ color: 0x0e0a24, roughness: 0.9, metalness: 0.05 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -3;
ground.receiveShadow = true;
scene.add(ground);

scene.fog = new THREE.FogExp2(0x1a0a35, 0.011);

// ============================================================
// STAGE 1/2: Bounded procedural terrain with textures & biomes
// ------------------------------------------------------------
// Noise: a lightweight, self-contained "value noise" (hashed lattice +
// smoothstep interpolation, summed across octaves). Not a full Perlin/
// Simplex library, but fully deterministic -- same seed, same world for
// every player, every time.
//
// Textures: generated on a tiny <canvas> at runtime instead of downloaded
// image files. This keeps the whole game asset-free and lightweight,
// which matters directly for the mobile/low-end-device goal.
//
// Biomes: chosen purely from terrain height -- low = sand, mid = grass,
// high = stone, very high = snow cap. Simple, deterministic, and it reads
// instantly to a kid as "beach, then hills, then mountain".
// ============================================================

function hash2D(x, y) {
  const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
  return s - Math.floor(s);
}
function smoothstep(t) { return t * t * (3 - 2 * t); }
function valueNoise2D(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const tl = hash2D(xi, yi), tr = hash2D(xi + 1, yi);
  const bl = hash2D(xi, yi + 1), br = hash2D(xi + 1, yi + 1);
  const u = smoothstep(xf), v = smoothstep(yf);
  const top = tl + (tr - tl) * u;
  const bottom = bl + (br - bl) * u;
  return top + (bottom - top) * v; // 0..1
}
function fbmNoise2D(x, y, octaves) {
  let total = 0, amp = 0.5, freq = 1, maxAmp = 0;
  for (let o = 0; o < octaves; o++) {
    total += (valueNoise2D(x * freq, y * freq) * 2 - 1) * amp;
    maxAmp += amp;
    amp *= 0.5;
    freq *= 2;
  }
  return total / maxAmp; // roughly -1..1
}

const TERRAIN_SPACING = 2;      // world units between columns (matches block footprint)
const TERRAIN_UNIT_HEIGHT = 1.5;

// ---- Tiny procedural pixel textures (no image downloads at all) ----
function makeVoxelTexture(baseColor, speckColor, speckDensity) {
  const size = 16;
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const ctx = c.getContext('2d');
  ctx.fillStyle = baseColor;
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = speckColor;
  for (let px = 0; px < size; px++) {
    for (let py = 0; py < size; py++) {
      if (hash2D(px + 0.1, py + 0.7) < speckDensity) ctx.fillRect(px, py, 1, 1);
    }
  }
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter; // crisp/blocky, matches the voxel look
  tex.minFilter = THREE.NearestFilter;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  return tex;
}
const TEX_GRASS = makeVoxelTexture('#4caf50', '#3d8b40', 0.25);
const TEX_DIRT  = makeVoxelTexture('#6b4226', '#5a3620', 0.3);
const TEX_SAND  = makeVoxelTexture('#e6d18a', '#d4bc6e', 0.2);
const TEX_STONE = makeVoxelTexture('#8a8a92', '#77777e', 0.3);
const TEX_SNOW  = makeVoxelTexture('#f2f6ff', '#dce6f5', 0.15);
const TEX_WOOD  = makeVoxelTexture('#5a3a22', '#4a2e1a', 0.35);
const TEX_LEAVES = makeVoxelTexture('#3d8b40', '#2f6e33', 0.35);
const TEX_SHRINE = makeVoxelTexture('#d8b86a', '#b8944a', 0.22);

// Manually build merged geometry (positions/normals/uvs/indices) so an
// entire chunk's worth of hills is ONE draw call per biome instead of
// hundreds of individual block meshes -- this is what keeps things smooth
// on mid/low-range phones later.
function addBoxToArrays(arrays, cx, cy, cz, sx, sy, sz) {
  const hx = sx / 2, hy = sy / 2, hz = sz / 2;
  const faces = [
    { n: [0, 1, 0], v: [[-hx, hy, -hz], [hx, hy, -hz], [hx, hy, hz], [-hx, hy, hz]] },
    { n: [0, -1, 0], v: [[-hx, -hy, hz], [hx, -hy, hz], [hx, -hy, -hz], [-hx, -hy, -hz]] },
    { n: [0, 0, 1], v: [[-hx, -hy, hz], [-hx, hy, hz], [hx, hy, hz], [hx, -hy, hz]] },
    { n: [0, 0, -1], v: [[hx, -hy, -hz], [hx, hy, -hz], [-hx, hy, -hz], [-hx, -hy, -hz]] },
    { n: [1, 0, 0], v: [[hx, -hy, hz], [hx, hy, hz], [hx, hy, -hz], [hx, -hy, -hz]] },
    { n: [-1, 0, 0], v: [[-hx, -hy, -hz], [-hx, hy, -hz], [-hx, hy, hz], [-hx, -hy, hz]] },
  ];
  const faceUVs = [[0, 0], [1, 0], [1, 1], [0, 1]];
  for (const f of faces) {
    const start = arrays.positions.length / 3;
    for (let k = 0; k < f.v.length; k++) {
      const v = f.v[k];
      arrays.positions.push(cx + v[0], cy + v[1], cz + v[2]);
      arrays.normals.push(f.n[0], f.n[1], f.n[2]);
      arrays.uvs.push(faceUVs[k][0], faceUVs[k][1]);
    }
    arrays.indices.push(start, start + 1, start + 2, start, start + 2, start + 3);
  }
}
function buildMergedGeometry(arrays) {
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(arrays.positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(arrays.normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(arrays.uvs, 2));
  geo.setIndex(arrays.indices);
  return geo;
}
function newArrays() { return { positions: [], normals: [], uvs: [], indices: [] }; }
function meshFromArrays(arrays, texture) {
  const mesh = new THREE.Mesh(
    buildMergedGeometry(arrays),
    new THREE.MeshStandardMaterial({ map: texture, roughness: 1 })
  );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  return mesh;
}

// Height bands that decide which biome texture a column's surface gets.
// (Thresholds are tuned against the actual achievable height range for
// this noise amplitude -- verified numerically before shipping, so stone
// and snow biomes are guaranteed to actually appear, not just in theory.)
const SAND_MAX_UNITS = 2;
const STONE_MIN_UNITS = 7;
const SNOW_MIN_UNITS = 9;

// A column's height is a pure deterministic function of its world (x,z) --
// this is what makes "infinite" terrain possible at all: we never need to
// store a giant heightmap array, we just recompute on demand, and it's
// always identical for the same coordinates no matter when it's asked.
function computeColumnHeightUnits(wx, wz) {
  const n = fbmNoise2D(wx * 0.045, wz * 0.045, 3);
  return Math.max(1, Math.round(4 + n * 8));
}
function computeColumnHeight(wx, wz) {
  return computeColumnHeightUnits(wx, wz) * TERRAIN_UNIT_HEIGHT;
}

// ============================================================
// STAGE 3: Chunk streaming
// ------------------------------------------------------------
// The world is split into fixed-size chunks. Only chunks within
// RENDER_RADIUS of the player are ever generated/rendered; anything
// further away is unloaded (geometry disposed, memory freed) and simply
// regenerated later if the player comes back -- since generation is pure
// math, a "reload" produces the exact same terrain every time.
// ============================================================

const CHUNK_COLUMNS = 16;                         // columns per chunk side
const CHUNK_WORLD_SIZE = CHUNK_COLUMNS * TERRAIN_SPACING;
const RENDER_RADIUS = 2;                          // chunks loaded in each direction (5x5 grid)
const loadedChunks = new Map();                   // "cx,cz" -> THREE.Group

function chunkCoordFromWorld(x, z) {
  return { cx: Math.floor(x / CHUNK_WORLD_SIZE), cz: Math.floor(z / CHUNK_WORLD_SIZE) };
}

// ============================================================
// STAGE 4: Golden Spiral Shrines -- rare surface structures with a
// hidden interior chamber and a treasure chest. This gives the same
// "mystery + hidden reward" thrill as caves, without touching the
// heightmap/collision architecture at all: a shrine is just extra
// geometry sitting on top of the terrain, generated and torn down with
// its chunk exactly like trees already are.
// ============================================================

const activeChests = []; // mesh references, for raycasting interaction

function openChest(mesh) {
  if (mesh.userData.opened) return;
  mesh.userData.opened = true;
  mesh.material.color.setHex(0xffe98a);
  mesh.material.emissiveIntensity = 0.9;
  spawnBurst(mesh.position.clone(), 0xffc24b, 30, 4);
  playSpatialTone({ type: 'sine', startFreq: 420, endFreq: 900, duration: 0.5, worldX: mesh.position.x, volume: 0.3 });
  triggerShake(0.05);
  const newlyUnlocked = unlockBlockType('crystal_bloom');
  addItem('golden_shard', 3);
  showToast(newlyUnlocked ? '\u2728 Treasure Found! +3 Golden Shards, Crystal Bloom unlocked! \u2728' : '\u2728 Treasure Found! +3 Golden Shards \u2728', 3800);
}

// A chunk has roughly a 1-in-14 chance of containing a shrine (rare and
// special on purpose -- this is meant to feel like a genuine discovery).
function maybeGenerateShrine(cx, cz, decorArrays) {
  if (hash2D(cx * 17.3 + 0.5, cz * 29.7 + 0.5) < 0.93) return null;

  const localI = 3 + Math.floor(hash2D(cx * 5.1, cz * 7.3) * (CHUNK_COLUMNS - 6));
  const localJ = 3 + Math.floor(hash2D(cx * 11.9, cz * 3.7) * (CHUNK_COLUMNS - 6));
  const anchorX = cx * CHUNK_WORLD_SIZE + localI * TERRAIN_SPACING;
  const anchorZ = cz * CHUNK_WORLD_SIZE + localJ * TERRAIN_SPACING;
  const heightUnits = computeColumnHeightUnits(anchorX, anchorZ);
  if (heightUnits <= SAND_MAX_UNITS || heightUnits >= SNOW_MIN_UNITS) return null; // only on solid grass/stone ground

  const baseY = heightUnits * TERRAIN_UNIT_HEIGHT;
  const wallHeight = 3.0;
  const wallMeshes = [];
  const wallMat = new THREE.MeshStandardMaterial({ map: TEX_SHRINE, roughness: 0.9 });

  const offsets = [-4, -2, 0, 2, 4];
  offsets.forEach(dx => {
    offsets.forEach(dz => {
      const isPerimeter = Math.abs(dx) === 4 || Math.abs(dz) === 4;
      const isDoorway = dx === 0 && dz === 4; // south-facing entrance gap
      if (!isPerimeter || isDoorway) return;

      const wx = anchorX + dx, wz = anchorZ + dz;
      const geo = new THREE.BoxGeometry(TERRAIN_SPACING, wallHeight, TERRAIN_SPACING);
      const mesh = new THREE.Mesh(geo, wallMat);
      mesh.position.set(wx, baseY + wallHeight / 2, wz);
      mesh.castShadow = true; mesh.receiveShadow = true;
      mesh.updateMatrixWorld(true);
      const box3 = new THREE.Box3().setFromObject(mesh);
      mesh.userData = { box3, isStatic: true, mining: false };
      blocksGroup.add(mesh);
      wallMeshes.push(mesh);
    });
  });

  // Roof cap + stepped tiers above it (pure decoration, merged with the
  // rest of the chunk's visuals -- no collision needed on the roof).
  const roofY = baseY + wallHeight + 0.15;
  addBoxToArrays(decorArrays, anchorX, roofY, anchorZ, 10, 0.3, 10);
  addBoxToArrays(decorArrays, anchorX, roofY + 1.05, anchorZ, 8, 1.8, 8);
  addBoxToArrays(decorArrays, anchorX, roofY + 2.85, anchorZ, 6, 1.8, 6);
  addBoxToArrays(decorArrays, anchorX, roofY + 4.65, anchorZ, 4, 1.8, 4);

  // The treasure chest, sitting in the middle of the hollow interior.
  const chestGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
  const chestMat = new THREE.MeshStandardMaterial({ color: 0xffc24b, emissive: 0xffc24b, emissiveIntensity: 0.5, roughness: 0.3, metalness: 0.6 });
  const chest = new THREE.Mesh(chestGeo, chestMat);
  chest.position.set(anchorX, baseY + 0.45, anchorZ);
  chest.castShadow = true;
  chest.userData = { isChest: true, opened: false };
  const chestGlow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW_TEXTURE, color: 0xffc24b, transparent: true, opacity: 0.5,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  chestGlow.scale.set(2.2, 2.2, 1);
  chest.add(chestGlow);
  scene.add(chest);
  activeChests.push(chest);

  return { wallMeshes, chest };
}

function generateChunk(cx, cz) {
  const key = `${cx},${cz}`;
  if (loadedChunks.has(key)) return;

  const dirtArrays = newArrays(), grassArrays = newArrays(), sandArrays = newArrays();
  const stoneArrays = newArrays(), snowArrays = newArrays();
  const trunkArrays = newArrays(), leafArrays = newArrays();
  const shrineArrays = newArrays();
  const originX = cx * CHUNK_WORLD_SIZE;
  const originZ = cz * CHUNK_WORLD_SIZE;

  for (let i = 0; i < CHUNK_COLUMNS; i++) {
    for (let j = 0; j < CHUNK_COLUMNS; j++) {
      const wx = originX + i * TERRAIN_SPACING;
      const wz = originZ + j * TERRAIN_SPACING;
      const heightUnits = computeColumnHeightUnits(wx, wz);
      const worldHeight = heightUnits * TERRAIN_UNIT_HEIGHT;

      const dirtHeight = Math.max(worldHeight - TERRAIN_UNIT_HEIGHT, TERRAIN_UNIT_HEIGHT * 0.4);
      const surfaceHeight = worldHeight - dirtHeight;
      addBoxToArrays(dirtArrays, wx, dirtHeight / 2, wz, TERRAIN_SPACING, dirtHeight, TERRAIN_SPACING);

      let surfaceArrays, isGrass = false;
      if (heightUnits <= SAND_MAX_UNITS) {
        surfaceArrays = sandArrays;
      } else if (heightUnits >= SNOW_MIN_UNITS) {
        surfaceArrays = snowArrays;
      } else if (heightUnits >= STONE_MIN_UNITS) {
        surfaceArrays = stoneArrays;
      } else {
        surfaceArrays = grassArrays;
        isGrass = true;
      }
      addBoxToArrays(surfaceArrays, wx, dirtHeight + surfaceHeight / 2, wz, TERRAIN_SPACING, surfaceHeight, TERRAIN_SPACING);

      // Sparse, deterministic low-poly trees -- based on world coordinates,
      // so a chunk always regrows identical trees if unloaded and revisited.
      if (isGrass && hash2D(wx * 0.31, wz * 0.53) > 0.91) {
        const trunkH = 2.2;
        addBoxToArrays(trunkArrays, wx, worldHeight + trunkH / 2, wz, 0.6, trunkH, 0.6);
        addBoxToArrays(leafArrays, wx, worldHeight + trunkH + 0.9, wz, 1.8, 1.8, 1.8);
      }
    }
  }

  const shrine = maybeGenerateShrine(cx, cz, shrineArrays);

  const group = new THREE.Group();
  [[dirtArrays, TEX_DIRT], [grassArrays, TEX_GRASS], [sandArrays, TEX_SAND],
   [stoneArrays, TEX_STONE], [snowArrays, TEX_SNOW], [trunkArrays, TEX_WOOD], [leafArrays, TEX_LEAVES],
   [shrineArrays, TEX_SHRINE]]
    .forEach(([arr, tex]) => {
      if (arr.positions.length === 0) return; // most chunks won't have every biome -- skip empty ones
      group.add(meshFromArrays(arr, tex));
    });
  scene.add(group);
  loadedChunks.set(key, {
    group,
    wallMeshes: shrine ? shrine.wallMeshes : [],
    chest: shrine ? shrine.chest : null,
  });
}

function unloadChunk(key) {
  const record = loadedChunks.get(key);
  if (!record) return;

  scene.remove(record.group);
  record.group.traverse(obj => {
    if (obj.geometry) obj.geometry.dispose();
    if (obj.material) obj.material.dispose(); // safe: shared textures (TEX_GRASS etc.) are untouched by this
  });

  record.wallMeshes.forEach(mesh => {
    blocksGroup.remove(mesh);
    mesh.geometry.dispose();
    mesh.material.dispose();
  });

  if (record.chest) {
    scene.remove(record.chest);
    record.chest.geometry.dispose();
    record.chest.material.dispose();
    const idx = activeChests.indexOf(record.chest);
    if (idx !== -1) activeChests.splice(idx, 1);
  }

  loadedChunks.delete(key);
}

let chunkUpdateAccum = 999; // force an immediate load on the very first frame
function updateChunkStreaming(delta) {
  chunkUpdateAccum += delta;
  if (chunkUpdateAccum < 0.35) return;
  chunkUpdateAccum = 0;

  const { cx: pcx, cz: pcz } = chunkCoordFromWorld(cameraRig.position.x, cameraRig.position.z);
  const needed = new Set();
  for (let dx = -RENDER_RADIUS; dx <= RENDER_RADIUS; dx++) {
    for (let dz = -RENDER_RADIUS; dz <= RENDER_RADIUS; dz++) {
      const key = `${pcx + dx},${pcz + dz}`;
      needed.add(key);
      if (!loadedChunks.has(key)) generateChunk(pcx + dx, pcz + dz);
    }
  }
  for (const key of Array.from(loadedChunks.keys())) {
    if (!needed.has(key)) unloadChunk(key);
  }
}

// Looks up terrain height under any world (x,z), used every frame so the
// player walks up and down hills instead of floating at a fixed altitude.
// This works identically whether or not that spot's chunk is currently
// loaded -- height is pure math, independent of what's rendered.
function getTerrainHeightAt(x, z) {
  const gx = Math.round(x / TERRAIN_SPACING) * TERRAIN_SPACING;
  const gz = Math.round(z / TERRAIN_SPACING) * TERRAIN_SPACING;
  return computeColumnHeight(gx, gz);
}

const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

// Without tone mapping, combined light from the sun + ambient + emissive
// blocks + additive glow sprites can exceed displayable brightness and
// clip straight to white -- this compresses it into a natural range
// instead, especially at the "noon" peak of the day/night cycle.
// Deliberately NOT using custom tone mapping or output encoding here.
// Both require every texture in the scene to be marked with matching
// color-space info to render correctly -- our hand-drawn canvas textures
// (sky, grass, dirt, glow sprites, etc.) were never set up for that, and
// the mismatch was the actual cause of the washed-out white rendering.

document.body.appendChild(renderer.domElement);

let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
let yaw = 0, pitch = 0;

const PLAYER_HALF = { x: 0.4, y: 0.9, z: 0.4 };
const _playerBox = new THREE.Box3();

function collidesAt(pos) {
  _playerBox.min.set(pos.x - PLAYER_HALF.x, pos.y - PLAYER_HALF.y, pos.z - PLAYER_HALF.z);
  _playerBox.max.set(pos.x + PLAYER_HALF.x, pos.y + PLAYER_HALF.y, pos.z + PLAYER_HALF.z);
  for (const block of blocksGroup.children) {
    if (block.userData.box3 && _playerBox.intersectsBox(block.userData.box3)) return true;
  }
  return false;
}

// ============================================================
// Camera shake ("physical weight" feedback)
// ============================================================
let shakeTime = 0, shakeDuration = 0.25, shakeMag = 0;
function triggerShake(mag) {
  shakeMag = Math.max(shakeMag, mag);
  shakeTime = shakeDuration;
}
function updateShake(delta) {
  if (shakeTime > 0) {
    shakeTime -= delta;
    const s = shakeMag * Math.max(shakeTime / shakeDuration, 0);
    camera.position.set((Math.random() - 0.5) * s, (Math.random() - 0.5) * s, 0);
  } else {
    camera.position.set(0, 0, 0);
  }
}

// ============================================================
// Particle bursts (mine/build feedback)
// ============================================================
const activeParticles = [];
function spawnBurst(position, colorHex, count, spread) {
  count = count || 16;
  spread = spread || 3;
  const positions = new Float32Array(count * 3);
  const velocities = [];
  for (let i = 0; i < count; i++) {
    positions[i * 3] = position.x;
    positions[i * 3 + 1] = position.y;
    positions[i * 3 + 2] = position.z;
    velocities.push(new THREE.Vector3(
      (Math.random() - 0.5) * spread,
      Math.random() * spread * 0.9 + 0.5,
      (Math.random() - 0.5) * spread
    ));
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: colorHex, size: 0.22, transparent: true, opacity: 1,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
  const points = new THREE.Points(geo, mat);
  scene.add(points);
  activeParticles.push({ points, velocities, life: 0, maxLife: 0.7 });
}
function updateParticles(delta) {
  for (let i = activeParticles.length - 1; i >= 0; i--) {
    const p = activeParticles[i];
    p.life += delta;
    const posAttr = p.points.geometry.attributes.position;
    for (let j = 0; j < p.velocities.length; j++) {
      const v = p.velocities[j];
      v.y -= 4.5 * delta; // gravity
      posAttr.array[j * 3] += v.x * delta;
      posAttr.array[j * 3 + 1] += v.y * delta;
      posAttr.array[j * 3 + 2] += v.z * delta;
    }
    posAttr.needsUpdate = true;
    p.points.material.opacity = Math.max(1 - p.life / p.maxLife, 0);
    if (p.life >= p.maxLife) {
      scene.remove(p.points);
      p.points.geometry.dispose();
      p.points.material.dispose();
      activeParticles.splice(i, 1);
    }
  }
}

// ============================================================
// Spatial-ish audio (synthesized, no external assets needed)
// ============================================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* no audio support */ }
  }
  return audioCtx;
}
function playSpatialTone(opts) {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const now = ctx.currentTime;
  const pan = Math.max(-1, Math.min(1, (opts.worldX - cameraRig.position.x) / 20));
  const dist = Math.abs(opts.worldX - cameraRig.position.x);
  const volume = Math.max((opts.volume || 0.2) * (1 - Math.min(dist / 30, 0.8)), 0.02);

  const osc = ctx.createOscillator();
  osc.type = opts.type || 'sine';
  osc.frequency.setValueAtTime(opts.startFreq, now);
  osc.frequency.exponentialRampToValueAtTime(Math.max(opts.endFreq, 1), now + opts.duration);

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + opts.duration);

  if (ctx.createStereoPanner) {
    const panner = ctx.createStereoPanner();
    panner.pan.setValueAtTime(pan, now);
    osc.connect(panner); panner.connect(gain);
  } else {
    osc.connect(gain);
  }
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + opts.duration + 0.02);
}
function playBuildSound(x) {
  playSpatialTone({ type: 'sine', startFreq: 300, endFreq: 720, duration: 0.16, worldX: x, volume: 0.22 });
}
function playMineSound(x, density) {
  const d = density || 1;
  playSpatialTone({ type: 'triangle', startFreq: 480 * d, endFreq: 110, duration: 0.14, worldX: x, volume: 0.24 });
}

// ============================================================
// Blocks: creation, contact shadows, glow, and pop/shrink animation
// ============================================================
const BLOCK_FOOTPRINT = 2;
const blockAnims = [];
let elapsedClock = 0;

function spawnBlock(id, x, y, z, height, blockType, shape) {
  if (blocksGroup.children.find(b => b.userData.id === id)) return;
  const type = BLOCK_TYPES[blockType] || BLOCK_TYPES[BLOCK_ORDER[0]];
  const h = height || 1.5;

  const geo = new THREE.BoxGeometry(BLOCK_FOOTPRINT, h, BLOCK_FOOTPRINT);
  const mat = new THREE.MeshStandardMaterial({
    color: type.color, roughness: 0.4, metalness: 0.5,
    emissive: type.color, emissiveIntensity: 0.18,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.updateMatrixWorld(true);

  // Cache the world-space bounding box BEFORE the pop-in animation shrinks
  // the mesh -- collision should always use the block's true final size.
  const box3 = new THREE.Box3().setFromObject(mesh);
  mesh.userData = { id, blockType, shape: shape || 'cube', box3, mining: false };

  // Vibrant glow halo, child of the block so it moves/removes with it.
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: GLOW_TEXTURE, color: type.color, transparent: true, opacity: 0.25,
    blending: THREE.AdditiveBlending, depthWrite: false,
  }));
  glow.scale.set(BLOCK_FOOTPRINT * 1.8, h * 1.8, 1);
  mesh.add(glow);

  blocksGroup.add(mesh);

  // Soft contact shadow blob on the ground beneath the block.
  const blob = new THREE.Mesh(
    new THREE.PlaneGeometry(BLOCK_FOOTPRINT * 1.3, BLOCK_FOOTPRINT * 1.3),
    new THREE.MeshBasicMaterial({ map: SHADOW_BLOB_TEXTURE, transparent: true, depthWrite: false })
  );
  blob.rotation.x = -Math.PI / 2;
  blob.position.set(x, 0.01, z);
  shadowBlobsGroup.add(blob);
  mesh.userData.shadowBlob = blob;

  // Pop-in "juice" animation.
  mesh.scale.setScalar(0.001);
  blockAnims.push({ mesh, type: 'build', start: elapsedClock, duration: 0.35 });
}

function triggerMineRemoval(id) {
  const mesh = blocksGroup.children.find(b => b.userData.id === id);
  if (!mesh || mesh.userData.mining) return;
  mesh.userData.mining = true;

  const type = BLOCK_TYPES[mesh.userData.blockType] || BLOCK_TYPES[BLOCK_ORDER[0]];
  spawnBurst(mesh.position.clone(), type.color, 16, 3);
  playMineSound(mesh.position.x, type.density);
  triggerShake(0.08 * type.density);

  if (mesh.userData.shadowBlob) {
    shadowBlobsGroup.remove(mesh.userData.shadowBlob);
    mesh.userData.shadowBlob.geometry.dispose();
    mesh.userData.shadowBlob.material.dispose();
  }

  blockAnims.push({ mesh, type: 'mine', start: elapsedClock, duration: 0.18 });
}

function updateBlockAnims() {
  for (let i = blockAnims.length - 1; i >= 0; i--) {
    const a = blockAnims[i];
    const t = Math.min((elapsedClock - a.start) / a.duration, 1);
    if (a.type === 'build') {
      a.mesh.scale.setScalar(Math.max(easeOutBack(t), 0.001));
      if (t >= 1) { a.mesh.scale.setScalar(1); blockAnims.splice(i, 1); }
    } else if (a.type === 'mine') {
      a.mesh.scale.setScalar(Math.max(1 - easeInQuad(t), 0.0001));
      if (t >= 1) {
        blocksGroup.remove(a.mesh);
        a.mesh.geometry.dispose();
        a.mesh.material.dispose();
        blockAnims.splice(i, 1);
      }
    }
  }
}

function activeTargetableBlocks() {
  return blocksGroup.children.filter(b => !b.userData.mining && !b.userData.isStatic);
}

// ============================================================
// Selection glow: soft neon outline on whatever block is targeted
// ============================================================
const highlightBox = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)),
  new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.9 })
);
highlightBox.visible = false;
scene.add(highlightBox);

function updateSelectionHighlight() {
  raycaster.setFromCamera(screenCenter, camera);
  const hits = raycaster.intersectObjects(activeTargetableBlocks());
  if (hits.length === 0) { highlightBox.visible = false; return; }
  const target = hits[0].object;
  const type = BLOCK_TYPES[target.userData.blockType] || BLOCK_TYPES[BLOCK_ORDER[0]];
  highlightBox.visible = true;
  highlightBox.position.copy(target.position);
  highlightBox.scale.set(
    BLOCK_FOOTPRINT * 1.06,
    (target.geometry.parameters.height) * 1.06,
    BLOCK_FOOTPRINT * 1.06
  );
  highlightBox.material.color.setHex(type.color);
  highlightBox.material.opacity = 0.55 + Math.sin(elapsedClock * 6) * 0.25;
}

function removeBlockById(id) {
  // Kept for backward compatibility with any direct/hard removal needs;
  // normal gameplay now goes through triggerMineRemoval for the juice.
  const target = blocksGroup.children.find(b => b.userData.id === id);
  if (target) {
    if (target.userData.shadowBlob) shadowBlobsGroup.remove(target.userData.shadowBlob);
    blocksGroup.remove(target);
  }
}

// ============================================================
// Networking
// ============================================================
function setupWebSocket() {
  socket = new WebSocket(`${WS_BACKEND}/ws/realm`);
  socket.onopen = () => document.getElementById('wsStatus').innerText = 'Live Synced';
  socket.onclose = () => document.getElementById('wsStatus').innerText = 'Offline Mode';
  socket.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === 'ADD_BLOCK') {
      spawnBlock(msg.id, msg.x, msg.y, msg.z, msg.height, msg.block_type, msg.shape);
      spawnBurst(new THREE.Vector3(msg.x, msg.y, msg.z), (BLOCK_TYPES[msg.block_type] || BLOCK_TYPES[BLOCK_ORDER[0]]).color, 10, 2);
      playBuildSound(msg.x);
    } else if (msg.type === 'REMOVE_BLOCK') {
      triggerMineRemoval(msg.id);
    }
  };
}

async function loadWorldData() {
  try {
    const spiral = await (await fetch(`${BACKEND}/api/generate-spiral?count=20`)).json();
    spiral.data.forEach(item => {
      spawnBlock(item.id, item.position.x, item.position.y, item.position.z, item.height, item.block_type, item.shape);
    });
  } catch (err) {
    console.warn('Terrain load failed, using local fallback.', err);
    for (let i = 1; i <= 15; i++) {
      spawnBlock(`fallback_${i}`, i * 0.8, i * 0.7, i * 0.8, 1.5, 'crystal_cyan', 'cube');
    }
  }

  try {
    const world = await (await fetch(`${BACKEND}/api/world`)).json();
    world.blocks.forEach(b => {
      spawnBlock(b.id, b.position.x, b.position.y, b.position.z, b.height, b.block_type, b.shape);
    });
  } catch (err) {
    console.warn('Persisted world load failed.', err);
  }
}

async function handleAction(type) {
  raycaster.setFromCamera(screenCenter, camera);
  const openChests = activeChests.filter(c => !c.userData.opened);
  const hits = raycaster.intersectObjects(activeTargetableBlocks().concat(openChests));
  if (hits.length === 0) return;
  const hit = hits[0];

  if (hit.object.userData.isChest) {
    openChest(hit.object);
    return;
  }

  if (type === 'MINE') {
    const blockId = hit.object.userData.id;
    triggerMineRemoval(blockId);
    try {
      await fetch(`${BACKEND}/api/remove-block`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: blockId })
      });
    } catch (e) { /* offline mode: local-only removal */ }
    if (socket && socket.readyState === WebSocket.OPEN) {
      socket.send(JSON.stringify({ type: 'REMOVE_BLOCK', id: blockId }));
    }
  } else if (type === 'BUILD') {
    const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
    const pos = hit.object.position.clone().add(normal.multiplyScalar(1.5));
    try {
      const res = await fetch(`${BACKEND}/api/verify-block`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          x: pos.x, y: pos.y, z: pos.z, height: 1.5,
          block_type: selectedBlockType, shape: selectedShape
        })
      });
      const data = await res.json();
      const block = data.block;
      spawnBlock(block.id, block.position.x, block.position.y, block.position.z, block.height, block.block_type, block.shape);
      spawnBurst(new THREE.Vector3(block.position.x, block.position.y, block.position.z),
        (BLOCK_TYPES[block.block_type] || BLOCK_TYPES[BLOCK_ORDER[0]]).color, 10, 2);
      playBuildSound(block.position.x);
      triggerCompanionCelebrate();
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({
          type: 'ADD_BLOCK', id: block.id,
          x: block.position.x, y: block.position.y, z: block.position.z,
          height: block.height, block_type: block.block_type, shape: block.shape
        }));
      }
    } catch (e) {
      console.warn('Build failed (backend offline).', e);
    }
  }
}

// ============================================================
// Hotbar UI
// ============================================================
function buildHotbar() {
  const hotbar = document.getElementById('hotbar');
  hotbar.innerHTML = '';
  unlockedBlockTypes.forEach((key, i) => {
    const slot = document.createElement('div');
    slot.className = 'hotbar-slot' + (key === selectedBlockType ? ' active' : '');
    slot.id = `slot-${key}`;
    slot.style.background = '#' + BLOCK_TYPES[key].color.toString(16).padStart(6, '0');
    slot.innerText = (i + 1);
    slot.onclick = () => selectBlockType(key);
    hotbar.appendChild(slot);
  });
}

function unlockBlockType(key) {
  if (unlockedBlockTypes.includes(key)) return false;
  unlockedBlockTypes.push(key);
  buildHotbar();
  return true;
}

let toastTimer = null;
function showToast(message, duration) {
  const toast = document.getElementById('toast');
  toast.innerText = message;
  toast.style.display = 'block';
  toast.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => { toast.style.display = 'none'; }, 400);
  }, duration || 3200);
}

// ============================================================
// STAGE 5: Inventory system (foundation)
// ------------------------------------------------------------
// A general-purpose item registry + counts, built so Stage 6 (farming),
// Stage 7 (animal resources), and Stage 9 (trading) can all plug into it
// without any further architecture changes. Two mobile-first surfaces:
// a compact always-visible resource strip (glance-and-go, no menu needed
// for basic awareness), and a tap-to-open grid panel for the full list.
// Right now the only source is the shrine chest -- Stage 6 will add wood/
// crops as the next items into this same system.
// ============================================================

const ITEM_TYPES = {
  golden_shard: { label: 'Golden Shard', color: 0xffd700 },
};
let inventory = {};

function addItem(id, qty) {
  inventory[id] = (inventory[id] || 0) + qty;
  refreshInventoryUI();
}

function makeItemIconStyle(id) {
  const type = ITEM_TYPES[id];
  return type ? `background:#${type.color.toString(16).padStart(6, '0')};` : 'background:#888;';
}

function refreshInventoryUI() {
  const strip = document.getElementById('resource-strip');
  const grid = document.getElementById('inventory-grid');
  const ids = Object.keys(inventory).filter(id => inventory[id] > 0);

  if (ids.length === 0) {
    strip.classList.remove('show');
    return;
  }
  strip.classList.add('show');

  strip.innerHTML = ids.map(id => `
    <div class="resource-chip">
      <div class="resource-icon" style="${makeItemIconStyle(id)}"></div>
      <span>${inventory[id]}</span>
    </div>
  `).join('');

  grid.innerHTML = ids.map(id => `
    <div class="inv-slot">
      <div class="inv-slot-icon" style="${makeItemIconStyle(id)}"></div>
      <div class="inv-slot-count">${inventory[id]}</div>
      <div>${(ITEM_TYPES[id] || { label: id }).label}</div>
    </div>
  `).join('');
}

function toggleInventoryPanel() {
  document.getElementById('inventory-panel').classList.toggle('show');
}

function selectBlockType(key) {
  selectedBlockType = key;
  document.querySelectorAll('.hotbar-slot').forEach(el => el.classList.remove('active'));
  document.getElementById(`slot-${key}`).classList.add('active');
}

// ============================================================
// Desktop controls
// ============================================================
document.addEventListener('keydown', (e) => {
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': moveForward = true; break;
    case 'KeyS': case 'ArrowDown': moveBackward = true; break;
    case 'KeyA': case 'ArrowLeft': moveLeft = true; break;
    case 'KeyD': case 'ArrowRight': moveRight = true; break;
    case 'Digit1': selectBlockType(BLOCK_ORDER[0]); break;
    case 'Digit2': selectBlockType(BLOCK_ORDER[1]); break;
    case 'Digit3': selectBlockType(BLOCK_ORDER[2]); break;
    case 'Digit4': selectBlockType(BLOCK_ORDER[3]); break;
    case 'KeyV': toggleShape(); break;
    case 'Space': e.preventDefault(); tryJump(); break;
    case 'ShiftLeft': case 'ShiftRight': isSprinting = true; break;
  }
});
document.addEventListener('keyup', (e) => {
  switch (e.code) {
    case 'KeyW': case 'ArrowUp': moveForward = false; break;
    case 'KeyS': case 'ArrowDown': moveBackward = false; break;
    case 'KeyA': case 'ArrowLeft': moveLeft = false; break;
    case 'KeyD': case 'ArrowRight': moveRight = false; break;
    case 'ShiftLeft': case 'ShiftRight': isSprinting = false; break;
  }
});
document.addEventListener('mousemove', (e) => {
  if (document.pointerLockElement === document.body) {
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
    cameraRig.rotation.y = yaw;
    camera.rotation.x = pitch;
  }
});
document.addEventListener('mousedown', (e) => {
  if (document.pointerLockElement !== document.body) return;
  if (e.button === 0) handleAction('MINE');
  else if (e.button === 2) handleAction('BUILD');
});
document.addEventListener('contextmenu', e => e.preventDefault());
document.body.addEventListener('click', () => {
  if (document.getElementById('avatar-modal').style.display === 'none' && !isTouchDevice()) {
    document.body.requestPointerLock();
  }
});

// ============================================================
// Mobile controls
// ============================================================
function isTouchDevice() {
  return 'ontouchstart' in window || navigator.maxTouchPoints > 0;
}

function bindTouchControls() {
  const setupBtn = (id, setVar) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', (e) => { e.preventDefault(); e.stopPropagation(); setVar(true); }, { passive: false });
    el.addEventListener('touchend', (e) => { e.preventDefault(); e.stopPropagation(); setVar(false); }, { passive: false });
  };
  setupBtn('btn-forward', v => moveForward = v);
  setupBtn('btn-backward', v => moveBackward = v);
  setupBtn('btn-left', v => moveLeft = v);
  setupBtn('btn-right', v => moveRight = v);

  document.getElementById('btn-mine').addEventListener('touchstart', (e) => {
    e.preventDefault(); e.stopPropagation(); handleAction('MINE');
  }, { passive: false });
  document.getElementById('btn-build').addEventListener('touchstart', (e) => {
    e.preventDefault(); e.stopPropagation(); handleAction('BUILD');
  }, { passive: false });
  document.getElementById('btn-jump').addEventListener('touchstart', (e) => {
    e.preventDefault(); e.stopPropagation(); tryJump();
  }, { passive: false });
  const sprintBtn = document.getElementById('btn-sprint');
  sprintBtn.addEventListener('touchstart', (e) => {
    e.preventDefault(); e.stopPropagation();
    isSprinting = !isSprinting;
    sprintBtn.classList.toggle('active', isSprinting);
  }, { passive: false });

  let lookId = null, lastX = 0, lastY = 0;
  window.addEventListener('touchstart', (e) => {
    for (const t of e.changedTouches) {
      if (t.clientX > window.innerWidth / 2 && lookId === null) {
        lookId = t.identifier; lastX = t.clientX; lastY = t.clientY;
      }
    }
  });
  window.addEventListener('touchmove', (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === lookId) {
        yaw -= (t.clientX - lastX) * 0.004;
        pitch -= (t.clientY - lastY) * 0.004;
        pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
        cameraRig.rotation.y = yaw;
        camera.rotation.x = pitch;
        lastX = t.clientX; lastY = t.clientY;
      }
    }
  });
  const clearLook = (e) => {
    for (const t of e.changedTouches) if (t.identifier === lookId) lookId = null;
  };
  window.addEventListener('touchend', clearLook);
  window.addEventListener('touchcancel', clearLook);

  document.querySelectorAll('.touch-btn').forEach(btn => btn.style.display = 'flex');
}

// ============================================================
// Entry point
// ============================================================
async function enterWorld() {
  const name = document.getElementById('playerName').value || 'Architect';
  const archetype = document.getElementById('avatarArchetype').value;

  getAudioCtx(); // must be created/resumed on a real user gesture

  try {
    await fetch(`${BACKEND}/api/register-player`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_name: name, avatar_archetype: archetype, realm_type: 'disney' })
    });
  } catch (err) {
    console.warn('Backend offline, running in local mode.');
  }

  document.getElementById('avatar-modal').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('crosshair').style.display = 'block';
  document.getElementById('hotbar-wrap').classList.add('show');
  document.getElementById('hudName').innerText = name;

  buildHotbar();
  setupWebSocket();

  if (isTouchDevice()) {
    bindTouchControls();
  } else {
    document.body.requestPointerLock();
  }

  loadWorldData();
}

// ============================================================
// Render loop
// ============================================================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.1);
  elapsedClock += delta;
  const speed = (isSprinting ? 18 : 11) * delta;

  updateDayCycle(delta);
  updateChunkStreaming(delta);

  // Cloud drift, wrapping around when far past the player.
  cloudsGroup.children.forEach(cloud => {
    cloud.position.x += cloud.userData.driftSpeed * delta;
    if (cloud.position.x > cameraRig.position.x + 100) cloud.position.x = cameraRig.position.x - 100;
  });

  const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(cameraRig.quaternion);
  const right = new THREE.Vector3(1, 0, 0).applyQuaternion(cameraRig.quaternion);
  forward.y = 0; right.y = 0; forward.normalize(); right.normalize();

  const move = new THREE.Vector3();
  if (moveForward) move.add(forward);
  if (moveBackward) move.sub(forward);
  if (moveRight) move.add(right);
  if (moveLeft) move.sub(right);
  if (move.lengthSq() > 0) move.normalize().multiplyScalar(speed);

  const candidate = cameraRig.position.clone();
  candidate.x += move.x;
  if (!collidesAt(candidate)) cameraRig.position.x = candidate.x;

  candidate.copy(cameraRig.position);
  candidate.z += move.z;
  if (!collidesAt(candidate)) cameraRig.position.z = candidate.z;

  // Vertical physics: gravity pulls down, terrain height + jump push back up.
  velocityY += GRAVITY * delta;
  let nextY = cameraRig.position.y + velocityY * delta;
  const groundY = getTerrainHeightAt(cameraRig.position.x, cameraRig.position.z) + EYE_HEIGHT;
  if (nextY <= groundY) {
    nextY = groundY;
    velocityY = 0;
    isGrounded = true;
  } else {
    isGrounded = false;
  }
  cameraRig.position.y = nextY;

  // Companion float + trail.
  const t = elapsedClock * 0.9;
  companion.position.set(
    cameraRig.position.x + Math.sin(t) * 1.8,
    cameraRig.position.y + 0.8 + Math.cos(t * 1.5) * 0.3,
    cameraRig.position.z + Math.cos(t) * 1.8
  );
  if (companionSpin > 0) {
    const spin = Math.min(companionSpin, 22 * delta);
    companion.rotation.y += spin;
    companionSpin -= spin;
  }
  trailHistory.unshift(companion.position.clone());
  if (trailHistory.length > TRAIL_LENGTH) trailHistory.pop();
  companionTrail.forEach((dot, i) => {
    const p = trailHistory[i] || companion.position;
    dot.position.copy(p);
    const fade = 1 - i / TRAIL_LENGTH;
    dot.material.opacity = 0.4 * fade;
    dot.scale.setScalar(0.3 + 0.7 * fade);
  });

  updateBlockAnims();
  updateParticles(delta);
  updateShake(delta);
  updateSelectionHighlight();

  renderer.render(scene, camera);
}
animate();
